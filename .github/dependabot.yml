# Dependency update PRs (A6-05). Weekly. Minor and patch updates come as one
# grouped PR per ecosystem and directory; a MAJOR update always comes as its
# own PR, because a major is a change to review on its merits (the first run
# grouped React 19, TypeScript 7 and tower 0.5 with patch bumps). At most two
# open at a time per entry, so this raises a signal instead of a queue nobody
# reads. Every PR still has to pass the
# whole CI, including `cargo audit` and the npm advisory gate
# (.github/npm-audit/): an update that fixes an allowlisted advisory fails
# that gate until the entry is removed, which is the point. Security updates
# (Dependabot alerts) are separate from this schedule and are enabled in the
# repository settings, not here.
version: 2
updates:
  # Every `uses:` is pinned to a commit SHA with a version comment;
  # Dependabot bumps both together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directory: /graphite-core
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      graphite-core:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The oracle pins the agave crates at the versions whose decoder it
  # mirrors; review a bump there as a change to the referee.
  - package-ecosystem: cargo
    directory: /tools/runtime-oracle
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # bincode 1.3 is the version agave's packet decoder uses; the oracle
      # must decode exactly as the runtime does, so it moves when agave does.
      - dependency-name: bincode
        update-types: ["version-update:semver-major"]
      # Round 36: solana-transaction and solana-message move TOGETHER (one
      # is built on the other: a lone bump of either gives two
      # VersionedMessage types and the oracle does not compile, PRs #47 and
      # #48), and 6.0 changes the v1 limits the oracle pins Graphite to
      # (Cargo.toml). A major bump of the referee is a deliberate change, made
      # by hand with the parser's limits decided alongside it.
      - dependency-name: solana-transaction
        update-types: ["version-update:semver-major"]
      - dependency-name: solana-message
        update-types: ["version-update:semver-major"]
    groups:
      runtime-oracle:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The inner-instruction oracle (Round 35) pins Agave's parser crate
  # (solana-transaction-status) at the version mainnet RPCs run; a PR that
  # moves it is a change of the referee and is reviewed as one.
  - package-ecosystem: cargo
    directory: /tools/inner-instruction-oracle
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: bincode
        update-types: ["version-update:semver-major"]
      # Round 36: solana-message must be the version
      # solana-transaction-status (the pinned parser) is built on. A lone major
      # bump gives two AccountKeys types and the oracle does not compile (PR
      # #52); it moves when the parser crate does.
      - dependency-name: solana-message
        update-types: ["version-update:semver-major"]
    groups:
      inner-instruction-oracle:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The cargo-fuzz crate (Round 30) has its own lockfile, outside the core's
  # build; without this entry its libfuzzer-sys pin never moved.
  - package-ecosystem: cargo
    directory: /graphite-core/fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      graphite-core-fuzz:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /integrations/vercel-ai
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      vercel-ai:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /integrations/mcp-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      mcp-server:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /integrations/agent-guard
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # @types/node follows the Node major CI and the docs run (22 LTS): types
      # from a later major would typecheck APIs the runtime does not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @solana/web3.js stays on 1.x (Round 34, D-7; reviewed 2026-10-22).
      # 2.x/3.x is a different API across the guard's public types (the
      # Connection, PublicKey, the transaction classes); the move is planned
      # work, not a weekly bump. The 1.x line's four moderate advisories and
      # why none is reachable are in .github/npm-audit/agent-guard.allow,
      # whose review-by date (2027-01-20) re-opens this decision. Remove this
      # ignore in the change that migrates.
      - dependency-name: "@solana/web3.js"
        update-types: ["version-update:semver-major"]
    groups:
      agent-guard:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /integrations/solana-agent-kit
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # @types/node follows the Node major CI and the docs run (22 LTS): types
      # from a later major would typecheck APIs the runtime does not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @solana/web3.js stays on 1.x (Round 34, D-7; reviewed 2026-10-22).
      # 2.x/3.x is a different API across the guard's public types (the
      # Connection, PublicKey, the transaction classes); the move is planned
      # work, not a weekly bump. The 1.x line's four moderate advisories and
      # why none is reachable are in .github/npm-audit/agent-guard.allow,
      # whose review-by date (2027-01-20) re-opens this decision. Remove this
      # ignore in the change that migrates.
      - dependency-name: "@solana/web3.js"
        update-types: ["version-update:semver-major"]
    groups:
      sak:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /sdk/typescript
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # @types/node follows the Node major CI and the docs run (22 LTS): types
      # from a later major would typecheck APIs the runtime does not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      sdk-typescript:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # @types/node follows the Node major CI and the docs run (22 LTS): types
      # from a later major would typecheck APIs the runtime does not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dashboard:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Round 32: the browser smoke's own pins (Playwright, axe-core). A
  # Playwright bump moves the Chromium the CI job downloads with it.
  - package-ecosystem: npm
    directory: /dashboard/e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      dashboard-e2e:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # sdk/go has no dependencies today; this keeps the `go` directive and any
  # future module under review.
  - package-ecosystem: gomod
    directory: /sdk/go
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      sdk-go:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Both base images are pinned by digest (Dockerfile). Without this entry
  # the digests never moved, and an image with a fixed CVE was never offered
  # (W23, external review).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  # Round 34 (R33-20): the production compose file pins its own images by
  # digest — caddy (the internet-facing TLS edge) and python (the AI layer) —
  # and the `docker` entry above reads only the Dockerfile, so neither digest
  # was ever offered a bump. The Core's image there is
  # ${GRAPHITE_IMAGE}@${GRAPHITE_IMAGE_DIGEST} (Round 36: the digest required), set
  # per deployment to a verified release, which Dependabot cannot and should
  # not move. Tools pinned by hand in the workflows (Caddy and promtool for
  # the deploy tests, Agave, cargo-audit, cargo-cyclonedx, the assurance
  # tools) have no ecosystem here: .github/pinned-tools.json lists them and
  # .github/workflows/pinned-tools.yml reports the stale ones every week.
  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  # requirements-lock.txt is hash-pinned (`pip install --require-hashes`).
  - package-ecosystem: pip
    directory: /python-ai-layer
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      python-ai-layer:
        patterns: ["*"]
        update-types: ["minor", "patch"]
