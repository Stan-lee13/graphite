name: Live devnet end to end

# Round 32 (P3): the gated path on a real cluster. A throwaway keypair is
# funded from the devnet faucet, the Core runs with the devnet RPC attached,
# and integrations/agent-guard/devnet-test.ts sends a small transfer through
# GraphiteGuard — grounded, capped, simulated, verified as bytes, decided,
# confirmed, signed, recorded, sent, reconciled by L8 — then the audit trail is
# walked with `graphite audit verify` (tools/live-measure/README.md).
#
# Manual only. The public faucet is unreliable, so the result must not depend
# on it (Round 32, P3b): a pinned Agave release (solana-test-validator, exact
# version, sha256-checked) is always fetched, and when the faucet still refuses
# after retries the same flow runs against that local real Solana runtime. The
# `cluster` input forces local-validator outright; a labelled PR uses it by
# default. The report names the cluster used. A gated path that does not
# complete after funding is a failure. No funds of value are involved: devnet
# or local SOL, throwaway keys, nothing persisted.
on:
  # workflow_dispatch works only once this file is on the default branch; on a
  # pull request, adding the `live-measure` label runs it with the defaults.
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      rpc_url:
        description: "Devnet RPC (the GRAPHITE_DEVNET_RPC_URL secret overrides it)"
        default: "https://api.devnet.solana.com"
        type: string
      seed_evidence:
        description: "Import the measured census for the System program (graphite evidence import-census) and its L3 anchor first (a fresh Core approves nothing without evidence)"
        default: true
        type: boolean
      airdrop_lamports:
        description: "Faucet request, lamports"
        default: "500000000"
        type: string
      cluster:
        description: "devnet (falls back to the local validator when the faucet refuses) or local-validator outright"
        default: devnet
        type: choice
        options:
          - devnet
          - local-validator

concurrency:
  group: live-devnet-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  e2e:
    name: Gated transfer on devnet or a local validator
    if: github.event_name != 'pull_request' || github.event.label.name == 'live-measure'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      REPORT_DIR: ${{ github.workspace }}/devnet-report
      # The Agave release the local validator comes from: exact version and
      # exact archive digest (tools/live-measure/README.md says how to bump).
      AGAVE_VERSION: v4.2.2
      AGAVE_SHA256: 5fc8684f7430038105fde953d4308ed56addf627f658daa61709f345448247ee
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Choose the RPC (masked; never printed)
        env:
          SECRET_RPC: ${{ secrets.GRAPHITE_DEVNET_RPC_URL }}
          INPUT_RPC: ${{ inputs.rpc_url || 'https://api.devnet.solana.com' }}
        run: |
          rpc="${SECRET_RPC:-$INPUT_RPC}"
          # Validated before it is printed, masked, then written in the
          # delimiter form (Round 34, D-9): a newline in the input can no
          # longer set another variable for the later steps.
          bash .github/scripts/set-rpc-env.sh "$rpc" "$GITHUB_ENV"
          R="$rpc" python3 -c 'import os,urllib.parse as u; print("rpc host:", u.urlsplit(os.environ["R"]).hostname)'
          mkdir -p "$REPORT_DIR"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-09-12
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: graphite-core
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Build the Core
        working-directory: graphite-core
        run: cargo build --release --locked --bin graphite

      - name: Install the agent guard (no lifecycle scripts)
        working-directory: integrations/agent-guard
        run: npm ci --ignore-scripts

      - name: Fetch the pinned Agave release (solana-test-validator, sha256-checked)
        run: |
          url="https://github.com/anza-xyz/agave/releases/download/${AGAVE_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          curl -fsSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/agave.tar.bz2" "$url"
          echo "$AGAVE_SHA256  $RUNNER_TEMP/agave.tar.bz2" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/agave"
          tar -xjf "$RUNNER_TEMP/agave.tar.bz2" -C "$RUNNER_TEMP/agave" solana-release/bin/solana-test-validator
          rm "$RUNNER_TEMP/agave.tar.bz2"
          v="$("$RUNNER_TEMP/agave/solana-release/bin/solana-test-validator" --version)"
          echo "$v"
          case "$v" in *" ${AGAVE_VERSION#v} "*) ;; *) echo "::error::expected Agave ${AGAVE_VERSION}, got: $v"; exit 1 ;; esac

      - name: Keys, airdrop, Core, AI layer, gated transfer, shutdown, audit
        id: run
        env:
          SEED: ${{ inputs.seed_evidence || github.event_name == 'pull_request' }}
          LAMPORTS: ${{ inputs.airdrop_lamports || '500000000' }}
          # A labelled PR runs on the local validator: its e2e result must not
          # depend on a public faucet.
          CLUSTER: ${{ inputs.cluster || 'local-validator' }}
        run: |
          seed_flag=""
          if [ "$SEED" != "true" ]; then seed_flag="--no-seed-evidence"; fi
          set +e
          python3 tools/live-measure/live_devnet.py --graphite graphite-core/target/release/graphite \
            --rpc "$LIVE_RPC_URL" --airdrop-lamports "$LAMPORTS" $seed_flag --cluster "$CLUSTER" \
            --validator "$RUNNER_TEMP/agave/solana-release/bin/solana-test-validator" --out-dir "$REPORT_DIR"
          code=$?
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          cat "$REPORT_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Scrub the RPC URL from the logs before upload
        if: always()
        run: |
          python3 - "$REPORT_DIR" <<'PY'
          import os, pathlib, sys
          secret = os.environ.get("LIVE_RPC_URL", "")
          for p in pathlib.Path(sys.argv[1]).rglob("*"):
              if p.is_file() and secret:
                  t = p.read_text(errors="replace")
                  if secret in t:
                      p.write_text(t.replace(secret, "<rpc-url>"))
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: live-devnet-report
          path: devnet-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Verdict
        env:
          CODE: ${{ steps.run.outputs.exit }}
        run: |
          if [ "$CODE" != "0" ]; then echo "::error::the gated path did not complete — see the job summary and the live-devnet-report artifact"; exit 1; fi
          echo "done (the summary names the cluster used; SKIPPED means the faucet refused and no validator ran)"
