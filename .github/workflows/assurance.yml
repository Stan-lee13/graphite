name: Assurance

# Round 30 (roadmap R-P11, R-P12, R-P15): continuous assurance beside the CI
# gate. Coverage-guided fuzzing of the parsers that read untrusted bytes, the
# mutation score of the security-critical modules, and a line-coverage floor.
#
# - Every pull request touching the core runs a SHORT, DETERMINISTIC fuzz
#   smoke of every target (fixed seed, fixed run count from the committed
#   seeds), so a parser change that panics or breaks an invariant fails here.
# - The schedule runs every target for 30 minutes, the mutation tests and the
#   coverage measurement. A crash is uploaded as an artifact and fails the run.
on:
  pull_request:
    paths:
      - "graphite-core/**"
      - ".github/workflows/assurance.yml"
  schedule:
    # Daily: long fuzz runs and the coverage floor.
    - cron: "17 3 * * *"
    # Weekly (Sunday): the mutation tests, which take hours.
    - cron: "41 4 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The nightly cargo-fuzz needs, pinned to a dated release so the
  # instrumentation does not change under a run.
  FUZZ_TOOLCHAIN: nightly-2026-10-22
  CARGO_FUZZ_VERSION: 0.13.2
  CARGO_MUTANTS_VERSION: 27.1.0
  CARGO_LLVM_COV_VERSION: 0.9.1

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    if: github.event_name != 'schedule' || github.event.schedule == '17 3 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - parse_transaction
          - lookup_table
          - manifest_json
          - token_extensions
          - state_diff
          - rpc_json
    defaults:
      run:
        working-directory: graphite-core/fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-09-12
        with:
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: graphite-core/fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version "$CARGO_FUZZ_VERSION"
      - name: Build
        run: cargo +"$FUZZ_TOOLCHAIN" fuzz build -O "${{ matrix.target }}"
      # Pull requests: deterministic. A fixed seed and a fixed number of runs
      # from the committed seeds give the same inputs on every run, so a red
      # result reproduces locally with the same command.
      - name: Smoke (deterministic)
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p "corpus/${{ matrix.target }}"
          cargo +"$FUZZ_TOOLCHAIN" fuzz run -O "${{ matrix.target }}" \
            "corpus/${{ matrix.target }}" "seeds/${{ matrix.target }}" -- \
            -seed=20261021 -runs=200000 -max_len=4096
      - name: Long run
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "corpus/${{ matrix.target }}"
          cargo +"$FUZZ_TOOLCHAIN" fuzz run -O "${{ matrix.target }}" \
            "corpus/${{ matrix.target }}" "seeds/${{ matrix.target }}" -- \
            -max_total_time=1800 -max_len=4096
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: graphite-core/fuzz/artifacts/${{ matrix.target }}
          retention-days: 30

  mutants:
    name: Mutants ${{ matrix.file }} ${{ matrix.shard }}
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '41 4 * * 0'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # Each security-critical module is mutated against the lib unit tests
      # and the integration suites that exercise it — the whole suite per
      # mutant would be days of runner time. A mutant one of these suites
      # misses may still be caught by another suite; the Round 30 report
      # lists the missed ones that were triaged by hand.
      # Round 36 (F-015): the first hosted run (40059300806) put 235, 199,
      # 324 and 1,004 mutants (`cargo mutants --list --file`) into six shards,
      # and every shard hit the six-hour limit before scoring. Round 36 cut
      # each shard to about 40 mutants; the suites and floor for each file are chosen
      # in the "Select" step below. A shard that cannot finish is reported
      # INCOMPLETE by mutation_floor.py, never scored on the part that ran:
      # it counts the shard's mutants from mutants.json, because the second
      # run (40083338181) showed outcomes.json's total_mutants is only the
      # outcomes recorded so far, and 16 killed shards were scored on it.
      # Round 40 (F-015, re-sharded): run 40083338181 measured one rebuild per
      # mutant at 6 to 9 minutes (--in-place, the selected suites), and about
      # 35 mutants fitting the 330-minute step, so its baseline (one build and
      # one run of the suites before the first mutant) took about 15 minutes.
      # Its shards held ~41 mutants and 18 of 44 were killed. Every shard now
      # holds at most 20 (`--sharding slice`, ceil(listed / shards)), so the
      # worst case is 15 + 20 x 9 = 195 of the step's 330 minutes (135 to
      # spare; at 6 minutes a mutant, 135 used and 195 to spare). Shards per
      # file, from
      # `cargo mutants --list --file F` at Round 40: risk_engine 235 -> 12,
      # simulation_integrity 199 -> 10, tx_artifact 324 -> 17, state_diff
      # 1,015 -> 51 (90 jobs; GitHub allows 256 per matrix). Round 41: run
      # 41195462495's Plan step refused state_diff shard 50/51 as EMPTY —
      # Round 41's code took state_diff to 1,150 mutants, ceil(1150/51) = 23
      # a shard and 50 x 23 = 1,150 — so state_diff is now 58 shards of at
      # most 20 (the last holds 10; 97 jobs; risk_engine 232, simulation_
      # integrity 199 and tx_artifact 324 still fit their counts). The "Plan" step
      # lists the shard before anything is built and fails at once, naming
      # the file, if a shard has grown past 24 (15 + 24 x 9 = 231 minutes,
      # still 99 inside the step) or is empty: add shards here, in a reviewed
      # change. ci-scripts.test.sh checks that every file's shards are
      # 0..N-1, each once. The suites, the floors and mutation_floor.py's
      # completeness check are unchanged.
      matrix:
        include:
          - { file: src/risk_engine.rs, shard: 0/12 }
          - { file: src/risk_engine.rs, shard: 1/12 }
          - { file: src/risk_engine.rs, shard: 2/12 }
          - { file: src/risk_engine.rs, shard: 3/12 }
          - { file: src/risk_engine.rs, shard: 4/12 }
          - { file: src/risk_engine.rs, shard: 5/12 }
          - { file: src/risk_engine.rs, shard: 6/12 }
          - { file: src/risk_engine.rs, shard: 7/12 }
          - { file: src/risk_engine.rs, shard: 8/12 }
          - { file: src/risk_engine.rs, shard: 9/12 }
          - { file: src/risk_engine.rs, shard: 10/12 }
          - { file: src/risk_engine.rs, shard: 11/12 }
          - { file: src/simulation_integrity.rs, shard: 0/10 }
          - { file: src/simulation_integrity.rs, shard: 1/10 }
          - { file: src/simulation_integrity.rs, shard: 2/10 }
          - { file: src/simulation_integrity.rs, shard: 3/10 }
          - { file: src/simulation_integrity.rs, shard: 4/10 }
          - { file: src/simulation_integrity.rs, shard: 5/10 }
          - { file: src/simulation_integrity.rs, shard: 6/10 }
          - { file: src/simulation_integrity.rs, shard: 7/10 }
          - { file: src/simulation_integrity.rs, shard: 8/10 }
          - { file: src/simulation_integrity.rs, shard: 9/10 }
          - { file: src/tx_artifact.rs, shard: 0/17 }
          - { file: src/tx_artifact.rs, shard: 1/17 }
          - { file: src/tx_artifact.rs, shard: 2/17 }
          - { file: src/tx_artifact.rs, shard: 3/17 }
          - { file: src/tx_artifact.rs, shard: 4/17 }
          - { file: src/tx_artifact.rs, shard: 5/17 }
          - { file: src/tx_artifact.rs, shard: 6/17 }
          - { file: src/tx_artifact.rs, shard: 7/17 }
          - { file: src/tx_artifact.rs, shard: 8/17 }
          - { file: src/tx_artifact.rs, shard: 9/17 }
          - { file: src/tx_artifact.rs, shard: 10/17 }
          - { file: src/tx_artifact.rs, shard: 11/17 }
          - { file: src/tx_artifact.rs, shard: 12/17 }
          - { file: src/tx_artifact.rs, shard: 13/17 }
          - { file: src/tx_artifact.rs, shard: 14/17 }
          - { file: src/tx_artifact.rs, shard: 15/17 }
          - { file: src/tx_artifact.rs, shard: 16/17 }
          - { file: src/state_diff.rs, shard: 0/58 }
          - { file: src/state_diff.rs, shard: 1/58 }
          - { file: src/state_diff.rs, shard: 2/58 }
          - { file: src/state_diff.rs, shard: 3/58 }
          - { file: src/state_diff.rs, shard: 4/58 }
          - { file: src/state_diff.rs, shard: 5/58 }
          - { file: src/state_diff.rs, shard: 6/58 }
          - { file: src/state_diff.rs, shard: 7/58 }
          - { file: src/state_diff.rs, shard: 8/58 }
          - { file: src/state_diff.rs, shard: 9/58 }
          - { file: src/state_diff.rs, shard: 10/58 }
          - { file: src/state_diff.rs, shard: 11/58 }
          - { file: src/state_diff.rs, shard: 12/58 }
          - { file: src/state_diff.rs, shard: 13/58 }
          - { file: src/state_diff.rs, shard: 14/58 }
          - { file: src/state_diff.rs, shard: 15/58 }
          - { file: src/state_diff.rs, shard: 16/58 }
          - { file: src/state_diff.rs, shard: 17/58 }
          - { file: src/state_diff.rs, shard: 18/58 }
          - { file: src/state_diff.rs, shard: 19/58 }
          - { file: src/state_diff.rs, shard: 20/58 }
          - { file: src/state_diff.rs, shard: 21/58 }
          - { file: src/state_diff.rs, shard: 22/58 }
          - { file: src/state_diff.rs, shard: 23/58 }
          - { file: src/state_diff.rs, shard: 24/58 }
          - { file: src/state_diff.rs, shard: 25/58 }
          - { file: src/state_diff.rs, shard: 26/58 }
          - { file: src/state_diff.rs, shard: 27/58 }
          - { file: src/state_diff.rs, shard: 28/58 }
          - { file: src/state_diff.rs, shard: 29/58 }
          - { file: src/state_diff.rs, shard: 30/58 }
          - { file: src/state_diff.rs, shard: 31/58 }
          - { file: src/state_diff.rs, shard: 32/58 }
          - { file: src/state_diff.rs, shard: 33/58 }
          - { file: src/state_diff.rs, shard: 34/58 }
          - { file: src/state_diff.rs, shard: 35/58 }
          - { file: src/state_diff.rs, shard: 36/58 }
          - { file: src/state_diff.rs, shard: 37/58 }
          - { file: src/state_diff.rs, shard: 38/58 }
          - { file: src/state_diff.rs, shard: 39/58 }
          - { file: src/state_diff.rs, shard: 40/58 }
          - { file: src/state_diff.rs, shard: 41/58 }
          - { file: src/state_diff.rs, shard: 42/58 }
          - { file: src/state_diff.rs, shard: 43/58 }
          - { file: src/state_diff.rs, shard: 44/58 }
          - { file: src/state_diff.rs, shard: 45/58 }
          - { file: src/state_diff.rs, shard: 46/58 }
          - { file: src/state_diff.rs, shard: 47/58 }
          - { file: src/state_diff.rs, shard: 48/58 }
          - { file: src/state_diff.rs, shard: 49/58 }
          - { file: src/state_diff.rs, shard: 50/58 }
          - { file: src/state_diff.rs, shard: 51/58 }
          - { file: src/state_diff.rs, shard: 52/58 }
          - { file: src/state_diff.rs, shard: 53/58 }
          - { file: src/state_diff.rs, shard: 54/58 }
          - { file: src/state_diff.rs, shard: 55/58 }
          - { file: src/state_diff.rs, shard: 56/58 }
          - { file: src/state_diff.rs, shard: 57/58 }
    defaults:
      run:
        working-directory: graphite-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-09-12
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: graphite-core
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked --version "$CARGO_MUTANTS_VERSION"
      - name: Select the suites and floor for this file
        id: select
        # Each security-critical module is mutated against the lib unit tests
        # and the integration suites that exercise it; the whole suite per
        # mutant would be days of runner time. A mutant these suites miss may
        # still be caught by another suite.
        #
        # risk_engine.rs: a round-robin quarter of its mutants scored 57 of
        # 57 viable against these suites after Round 30's tests (39 of 57
        # against the risk suites alone); 0.90 leaves room for the rest. The
        # other floors are PROVISIONAL (never yet measured to completion):
        # raise each to its first complete measured score, rounded down.
        run: |
          case "${{ matrix.file }}" in
            src/risk_engine.rs)
              floor=0.90
              tests="--lib --test adversarial_tests --test secondary_instruction_risk --test p0_validation_attacks --test omega_red_team --test integration_tests --test cert_revalidation_attacks --test regression_corpus --test truncated_discriminator --test round21_open_list --test mainnet_conformance --test real_exploit_tests --test real_world_attacks --test extreme_adversarial --test round22_remaining --test hell_mode_tests --test deep_extreme_tests --test protocol_expansion_tests --test intent_synonym_consistency --test campaign_invariants --test release_evaluation" ;;
            src/simulation_integrity.rs)
              floor=0.60
              tests="--lib --test audit_a2_baseline_variance_ratchet --test audit_a2_shadow_takes_refused_requests --test round19_what_one_observation_is --test audit_2026_10_20_simulation_gate" ;;
            src/tx_artifact.rs)
              floor=0.60
              tests="--lib --test tx_artifact_real --test wire_format_bounds --test alt_real_v0 --test round19_v1_transactions --test durable_nonce --test audit_a1_compute_budget_trailing --test alt_privilege --test privilege_from_artifact" ;;
            src/state_diff.rs)
              floor=0.60
              tests="--lib --test round29_state_diff --test l4_state_diff_gate --test token2022_extensions --test round20_transfer_fee --test audit_a2_data_only_change_is_not_noop --test audit_a2_delegate_allowance_increase --test audit_a2_declared_effects_account_names --test round30_fuzz_findings" ;;
            *) echo "::error::no suites for ${{ matrix.file }}"; exit 1 ;;
          esac
          echo "floor=$floor" >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
      - name: Plan (the shard fits the step)
        # Round 40 (F-015): the shard's own mutant list, before anything is
        # built (`--list` reads the source; no build, no test). A shard past
        # 24 mutants cannot be relied on to finish inside the Mutate step at
        # the measured 9 minutes a mutant, so it fails here in seconds,
        # naming the file to re-shard, instead of being killed after 330
        # minutes and reported INCOMPLETE. An empty shard fails too.
        env:
          FILE: ${{ matrix.file }}
          SHARD: ${{ matrix.shard }}
          MAX_PER_SHARD: 24
        run: |
          set -euo pipefail
          n="$(cargo mutants --list --file "$FILE" --shard "$SHARD" --sharding slice | wc -l)"
          echo "$FILE shard $SHARD: $n mutants (at most $MAX_PER_SHARD)"
          if [ "$n" -eq 0 ] || [ "$n" -gt "$MAX_PER_SHARD" ]; then
            echo "::error::$FILE shard $SHARD lists $n mutants; each shard must hold 1..$MAX_PER_SHARD to finish inside the Mutate step: add shards for $FILE in .github/workflows/assurance.yml"
            exit 1
          fi
      - name: Mutate
        # cargo-mutants exits non-zero when a mutant is missed; the floor
        # step below judges the run from the outcomes file, so that exit is
        # recorded here rather than fatal. The step stops short of the job's
        # limit so the floor step always runs: on an unfinished shard it
        # reports INCOMPLETE rather than nothing (Round 36). `--sharding
        # slice` is 27.1.0's default, named so the Plan step above and this
        # step cannot split the file differently.
        timeout-minutes: 330
        run: |
          set +e
          cargo mutants --in-place --no-shuffle --timeout 300 \
            --file "${{ matrix.file }}" --shard "${{ matrix.shard }}" --sharding slice \
            -- ${{ steps.select.outputs.tests }}
          echo "cargo-mutants exit: $?"
      - name: Enforce the mutation-score floor
        if: always() && steps.select.outcome == 'success'
        run: python3 scripts/mutation_floor.py mutants.out/outcomes.json "${{ steps.select.outputs.floor }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          # The job index, not a step's output: Round 36's run named every
          # artifact "mutants-" because the naming step never ran after a
          # timeout.
          name: mutants-${{ strategy.job-index }}-${{ strategy.job-total }}
          path: graphite-core/mutants.out
          retention-days: 30

  coverage:
    name: Line coverage floor
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: graphite-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-09-12
        with:
          toolchain: 1.99.1
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: graphite-core
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version "$CARGO_LLVM_COV_VERSION"
      - name: Measure, and fail below the floor
        # The floor is 78: the line coverage the library's OWN unit tests
        # reach (78.42% of 37,650 lines, measured when this job was added,
        # Round 30), rounded down. This job adds every integration suite, so
        # it measures at least that; raise the floor to the first number this
        # job reports, and only ever upward.
        # `--profile ci-test` (Round 34, R33-8): the release profile without
        # LTO, as CI's test legs run. With thin LTO and one codegen unit,
        # every one of the ~160 instrumented test binaries was re-optimized
        # whole at link time — the cost that cancelled CI's Rust job at 60
        # minutes — inside this job's 120. Source-based coverage counts
        # regions of the source, not of the optimized code.
        run: |
          cargo llvm-cov --profile ci-test --all-features --lib --tests \
            --fail-under-lines 78 --summary-only --json --output-path coverage.json
      - name: Report the measured coverage
        # The JSON summary prints nothing to the log; the numbers a floor is
        # raised to belong in the run, not only in an artifact.
        if: always()
        run: |
          python3 - coverage.json <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          data = json.load(open(sys.argv[1]))["data"][0]
          t = data["totals"]["lines"]
          print(f"TOTAL line coverage: {t['percent']:.2f}% ({t['covered']}/{t['count']} lines)")
          for f in sorted(data["files"], key=lambda f: f["filename"]):
              name = f["filename"].split("graphite-core/", 1)[-1]
              if name.startswith("src/"):
                  l = f["summary"]["lines"]
                  print(f"  {name}: {l['percent']:.2f}% ({l['covered']}/{l['count']})")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: graphite-core/coverage.json
          retention-days: 30
