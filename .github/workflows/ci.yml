name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      no_default_features:
        description: "Also gate the library without default features (finding #4)"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust core — fmt, clippy, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: graphite-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: graphite-core
      - name: Format
        run: cargo fmt --all -- --check
      - name: Library builds with no features (embedded-use contract)
        if: always()
        run: cargo check --no-default-features
      - name: Library builds with cli feature only (no rpc/server)
        if: always()
        run: cargo check --no-default-features --features cli
      - name: Clippy (all targets, all features — includes the rpc feature)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        # `default = ["server", "cli"]` and `server` pulls `rpc`, so this IS the
        # all-features run for this crate; a separate `--all-features` job would
        # compile the same thing twice.
        run: cargo test --release
      # The two configurations below were COMPILED above and never run. That is
      # not the same gate: `cargo check --no-default-features` passed for months
      # while `cargo test --no-default-features` had 28 failures (review finding
      # #8, 2026-09-11).
      - name: Tests — embeddable core, no features
        if: always()
        # `--lib` deliberately. Without a feature there is no async runtime, so
        # `verify()` is a fail-closed stub and the behavioural suite is
        # inapplicable by construction; running it here would gate on tests that
        # cannot pass rather than on anything true. What this DOES gate is the
        # pure deterministic core — the parser, the state diff, the risk engine,
        # manifest handling, content_hash — plus one assertion that the stub
        # refuses instead of approving.
        run: cargo test --release --no-default-features --lib
      - name: Tests — cli feature only, no server or rpc
        if: always()
        run: cargo test --release --no-default-features --features cli

  supply-chain:
    name: Dependency CVE audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: graphite-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: graphite-core
      # A security product shipping unscanned dependencies is not defensible.
      # The tree includes tokio, axum, reqwest and the ed25519/curve25519
      # crypto crates — a RUSTSEC advisory against any of them must fail the
      # build, not ship silently.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies for known vulnerabilities
        run: cargo audit --deny warnings

  container:
    name: Container — build + live smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Dockerfile/compose stack is the documented one-command deploy
      # path, but nothing gated it before: a Dockerfile-breaking change (or a
      # regression in the /data ownership or the bind/auth interlock) could
      # merge with a fully green CI. This builds the actual artifact and
      # proves it serves traffic.
      - name: Build image
        run: docker build -t graphite-core:ci .
      - name: Run container
        run: |
          docker run -d --name graphite-ci \
            -e GRAPHITE_API_KEY=ci-smoke-test-key \
            -p 7331:7331 graphite-core:ci
      - name: Wait for health
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:7331/health >/dev/null; then
              echo "healthy after ${i} attempts"; exit 0
            fi
            sleep 3
          done
          echo "container never became healthy"; docker logs graphite-ci; exit 1
      - name: Durability probe — audit trail must actually be written
        run: |
          # Regression gate for the container /data ownership bug: a server
          # that cannot write its audit log must not have started at all.
          docker exec graphite-ci sh -c 'touch /data/.ci-probe && rm /data/.ci-probe' \
            || { echo "FAIL: /data not writable by the container user"; docker logs graphite-ci; exit 1; }
      - name: Auth must be enforced
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:7331/verify \
            -H 'content-type: application/json' -d '{}')
          if [ "$code" != "401" ]; then
            echo "FAIL: unauthenticated /verify returned $code, expected 401"
            docker logs graphite-ci; exit 1
          fi
      - name: Container logs
        if: always()
        run: docker logs graphite-ci || true
      - name: Cleanup
        if: always()
        run: docker rm -f graphite-ci || true

  typescript:
    name: TypeScript SDK + SAK integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: SDK typecheck + AuditBind cross-language parity
        working-directory: sdk/typescript
        run: |
          # `npm ci` alone: the previous `npm ci || npm install` fallback
          # meant a lockfile problem silently downgraded the job to
          # unpinned resolution, which is the failure mode the lockfile
          # exists to prevent.
          npm ci
          npm run check
          # Pins the TS content_hash to the SAME vectors the Rust core and the
          # Go SDK assert. If any of the three implementations drifts, the
          # TOCTOU check silently stops matching — so this must gate.
          # Uses the declared `test` script (tsx is a pinned devDependency)
          # rather than `npx tsx`, which would fetch an unpinned version from
          # the network at job time.
          npm test
          # The published package must actually build, and must not ship the
          # test file — dist/ is gitignored, so a broken build config would
          # otherwise only surface at publish time.
          npm run build
      - name: SAK integration typecheck + AuditBind cross-language tests
        working-directory: integrations/solana-agent-kit
        run: |
          # `npm ci` for the lockfile, `npm run` for the binaries. `npx tsc`
          # and `npx tsx` fetch whatever version resolves at job time, which
          # puts an unpinned download inside the build of the thing that is
          # supposed to be the trustworthy part of the stack.
          npm ci
          npm run typecheck
          # `npm test` runs every *.test.ts in the directory. The previous
          # invocation named two files, so a third test file could sit in the
          # repository looking like a gate without ever running.
          npm test
          # The bridge and the Rust Core are two implementations of one
          # agreement: the bridge serializes a transaction and describes its
          # instructions, the Core reads both and decides whether they agree.
          # `sak_bridge_artifact.json` is the TypeScript side's real output and
          # the Rust suite asserts against it, so it has to be regenerated from
          # the code rather than kept in step by hand. Any drift shows up as a
          # diff here instead of as a blocked transaction in production.
          npm run emit:artifact-fixture
          git diff --exit-code -- ../../graphite-core/fixtures/artifacts/sak_bridge_artifact.json

  go:
    name: Go SDK — fmt, vet, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      # Mirrors the Rust job's `cargo fmt --check`. gofmt exits 0 whether or
      # not it finds anything, so the check is on its OUTPUT being empty —
      # and the unformatted file list is printed before failing, so the fix
      # is obvious from the log alone.
      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files. Run 'gofmt -w sdk/go/'"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test ./...

  dashboard:
    name: Dashboard — typecheck + production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  python:
    name: Python AI layer — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-ai-layer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: pip install -r requirements.txt
      - name: Tests
        run: pytest -q
