name: CI

on:
  push:
    branches: [main, phase2-development]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test + Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            graphite-core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('graphite-core/Cargo.lock') }}

      - name: Build
        working-directory: graphite-core
        run: cargo build --release

      - name: Test
        working-directory: graphite-core
        run: cargo test --release

      - name: Clippy
        working-directory: graphite-core
        run: cargo clippy --release -- -D warnings

  python-tests:
    name: Python AI Layer Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test
        working-directory: python-ai-layer
        run: python3 -m pytest test_intent_parser.py -v
