name: CI

on:
  # Round 29 (audit 2026-10-20, C5): every push to any branch AND every pull
  # request ran the whole workflow, so a branch with an open PR ran it twice
  # per push. Pushes run for main and for release tags; every other branch is
  # tested through its pull request (which tests the merge result).
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Round 30: if the `main` ruleset (.github/rulesets/main.json) turns on a
  # merge queue, the queue's candidate commit is tested by this same workflow
  # and reports the same `CI gate` check the ruleset requires.
  merge_group:
  # Weekly, so a new RUSTSEC/npm/PyPI advisory against an unchanged tree turns
  # main red the week it is published instead of the next time someone
  # happens to push (Round 30). Monday 06:17 UTC: off the hour, like any cron.
  schedule:
    - cron: "17 6 * * 1"
  # Manual runs gate exactly what a push gates. There is deliberately no
  # input: the no-default-features legs are part of the contract, not a
  # switch (A6-07 removed an input nothing read).
  workflow_dispatch:

concurrency:
  # Only a pull request's superseded runs are cancelled (Round 30). On main,
  # tags and the merge queue every commit keeps its own run: the group is the
  # commit there, because a shared group cancelled the older run (and GitHub
  # also drops a queued run when a newer one joins its group), which left a
  # merged commit with no completed CI whenever the next merge came quickly.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Round 30: every `run:` step is `bash --noprofile --norc -eo pipefail {0}`.
# GitHub's default for a step without `shell:` is `bash -e {0}`, with no
# pipefail, so `cargo test | tee log` took tee's exit status and a failing
# run piped into a log passed (the A6-01 failure mode, closed here for every
# step at once rather than step by step).
# A job's own `defaults.run` replaces this block, not merges into it, so every
# job that sets a working directory repeats `shell: bash` (seen on the first
# PR run: those jobs ran `bash -e {0}`, without pipefail).
defaults:
  run:
    shell: bash

# Round 9 (repository integrity): the GITHUB_TOKEN this workflow receives can
# only read the repository. Nothing here pushes, tags, releases, or writes to
# issues or packages, so nothing here should hold a token that can. A
# compromised dependency or action running inside a job gets a read-only
# token instead of whatever the repository default grants.
permissions:
  contents: read

jobs:
  # Round 34 (R33-8): the one `rust` job became `rust-lint` and a three-leg
  # `rust-test` matrix. As one job it ran fmt, two checks, three clippy legs and
  # three release test legs back to back (default 2,557 s, cli 932 s, lib 72 s
  # on the PR run of e34a42d, which passed in 59:19 of its 60 minutes); on the
  # pushes of b473a31 and 9f4556e it hit the 60-minute ceiling, was cancelled,
  # and a cancelled run never saves its cache, so the next push started cold
  # again. Every step, command, floor, allowlist and clean-tree check is the
  # same as before, split across jobs that run in parallel, each with its own
  # cache and its own ceiling; both are in `ci-gate.needs`, and a matrix with a
  # failed leg reports `failure` there.
  rust-lint:
    name: Rust core — fmt, check, clippy
    # A pinned runner image, not `ubuntu-latest` (A6-08): the label moves to a
    # new OS release on GitHub's schedule, not on a reviewed commit here.
    runs-on: ubuntu-24.04
    # Every job has a ceiling (A6-03): without one a hung step holds the
    # runner for GitHub's 360-minute default before anything turns red. Two
    # checks and three clippy legs, all debug builds sharing one cache: well
    # under 15 minutes warm (~90 s of the old job's time was everything but
    # the three test legs); 30 leaves a cold cache after a Cargo.lock change
    # room.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: graphite-core
        shell: bash
    steps:
      # `persist-credentials: false` on every checkout (A6-10): nothing here
      # pushes, so the token has no reason to sit in .git/config where every
      # later step, dependency install scripts included, could read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned to a commit of the `stable` branch (2026-09-12). The action
      # used to read the toolchain from the ref name, so with a SHA it is
      # named explicitly — and named as the exact release the container is
      # built with (Dockerfile `rust:1.99.1-bookworm`), so the compiler that
      # runs the certification is the compiler that produces the shipped
      # binary (Round 10). Bump both together.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-09-12
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: graphite-core
          key: lint
      - name: Format
        run: cargo fmt --all -- --check
      - name: Library builds with no features (embedded-use contract)
        if: always()
        run: cargo check --locked --no-default-features
      - name: Library builds with cli feature only (no rpc/server)
        if: always()
        run: cargo check --locked --no-default-features --features cli
      - name: Clippy (all targets, all features — includes the rpc feature)
        if: always()
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      # The other two feature legs get the same lint gate (A6-06). CURRENT.md
      # says "Clippy -D warnings (all three feature legs)"; until now only the
      # local mirror enforced two of them, so they could drift unseen. The
      # flags are the mirror's: `--lib` for the featureless leg, because that
      # is all its test leg runs (see rust-test), and `--all-targets` for the
      # cli leg, whose test leg compiles every target.
      - name: Clippy (library, no features)
        if: always()
        run: cargo clippy --locked --no-default-features --lib -- -D warnings
      - name: Clippy (all targets, cli feature only)
        if: always()
        run: cargo clippy --locked --all-targets --no-default-features --features cli -- -D warnings

  rust-test:
    name: Rust core — tests (${{ matrix.leg }})
    runs-on: ubuntu-24.04
    # A ceiling per leg (R33-8). Measured under the old single job with
    # `--release` (thin LTO, one codegen unit): default 2,557 s, cli 932 s,
    # lib 72 s. Under `--profile ci-test` (graphite-core/Cargo.toml: the
    # release profile without LTO, 16 codegen units) each leg takes a fraction
    # of that; the ceilings still hold the OLD timings with room, so even a
    # cold cache cannot cancel a leg, and a hang still fails within them.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      # Every leg reports, so one red leg does not hide the state of the others.
      fail-fast: false
      matrix:
        include:
          # `default = ["server", "cli"]` and `server` pulls `rpc`, so this IS
          # the all-features run for this crate; a separate `--all-features`
          # leg would compile the same thing twice.
          - leg: default
            flags: ""
            floor: 2464
            timeout: 90
          # `--lib` deliberately. Without a feature there is no async runtime
          # to drive the synchronous `verify()`, so it refuses with an error
          # naming the features to build with (`verify_async` is the whole
          # pipeline in every build), and the behavioural suite, which calls
          # `verify()`, is inapplicable by construction. What this DOES gate is
          # the pure deterministic core — the parser, the state diff, the risk
          # engine, manifest handling, content_hash — plus one assertion that
          # the synchronous call refuses instead of approving.
          # The two no-default-features configurations were COMPILED by
          # `cargo check` and never run until review finding #8 (2026-09-11):
          # `cargo check --no-default-features` passed for months while
          # `cargo test --no-default-features` had 28 failures.
          - leg: lib
            flags: "--no-default-features --lib"
            floor: 530
            timeout: 20
          - leg: cli
            flags: "--no-default-features --features cli"
            floor: 1980
            timeout: 45
    defaults:
      run:
        working-directory: graphite-core
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history with its tags. The P13 contract gate
          # (tests/contract_version_gate.rs) compares the published schemas
          # with a committed snapshot of the last release, so it runs in any
          # checkout (Round 29, C3); with the tags it also proves the
          # snapshot is byte-identical to the release and that no newer
          # release has left it behind.
          fetch-depth: 0
      # The compiler rust-lint names and the Dockerfile ships with.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-09-12
        with:
          toolchain: 1.99.1
      # One cache per leg: the three legs compile three feature sets, and a
      # shared key would let whichever leg saved first decide what the others
      # restore.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: graphite-core
          key: test-${{ matrix.leg }}
      - name: Tests (${{ matrix.leg }})
        # `--profile ci-test`: the release profile's semantics without LTO
        # (graphite-core/Cargo.toml says exactly what differs and why).
        # `--locked` (Round 17, F-16-13): a Cargo.lock that drifts from
        # Cargo.toml fails here instead of being silently re-resolved, so the
        # tests run against the dependency versions the image ships.
        # Round 30: the log is read back, so the gate is "at least the floor
        # passed and none failed", not just "cargo exited 0" — which it also
        # does when no test binary ran at all. The floors are the counts at
        # Round 36 (2,363 / 513 / 1,942; 2,331 / 509 / 1,933 at Round 35); a change that deletes tests below one
        # lowers it in the same reviewed diff. The log lives outside the tree
        # so the clean-tree check below still sees only what the tests wrote.
        env:
          FLAGS: ${{ matrix.flags }}
          FLOOR: ${{ matrix.floor }}
          LEG: ${{ matrix.leg }}
          # The snapshot's provenance check needs the tags; here a missing
          # tag fails instead of being skipped.
          GRAPHITE_CONTRACT_GATE_REQUIRED: "1"
        run: |
          # $FLAGS is split on purpose: "" adds nothing, the others add flags.
          # shellcheck disable=SC2086
          cargo test --locked --profile ci-test $FLAGS 2>&1 | tee "$RUNNER_TEMP/cargo-test-$LEG.log"
          # The floor is a sum over every test binary (D2-8, Round 38), so a
          # security suite that lost its tests hid behind growth elsewhere.
          # Round 40: each leg also passes its per-binary floors file
          # (.github/test-floors/rust-$LEG.txt: the library's unit tests and
          # every security suite, at the counts of a full run of the leg),
          # and test-count.sh fails a listed binary that did not run or fell
          # below its floor. ci-scripts.test.sh fails when a security suite
          # is in no floors file.
          bash ../.github/scripts/test-count.sh cargo "$RUNNER_TEMP/cargo-test-$LEG.log" "$FLOOR" ../.github/test-allowlists/rust-ignored.txt "../.github/test-floors/rust-$LEG.txt"
      # `corpus_persists_and_reloads_identically` (tests/regression_corpus.rs)
      # writes the regression corpus back into fixtures/corpus, which is
      # tracked. If the generator and the committed corpus disagree, the test
      # still passes and the tree is simply dirty — so CI must look (A6-04).
      # `git status --porcelain` also catches files the run ADDED, which
      # `git diff` alone would not. Fix by committing the regenerated corpus
      # in the same change as whatever moved it.
      # W23 (external review): the check covered fixtures/corpus only, so a
      # test writing to any other tracked path (protocols/, fixtures/artifacts)
      # left the tree dirty and passed. Every path is checked, after every leg
      # (the cli leg runs the corpus test too; its output must match as well).
      - name: The test run changed nothing in the tree
        if: always()
        run: |
          git diff --exit-code --stat
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the test run changed or added files; a corpus change must be committed with whatever moved it, and nothing else may be written"
            git status --porcelain
            exit 1
          fi

  supply-chain:
    name: Dependency CVE audit
    runs-on: ubuntu-24.04
    # Under a minute warm; a cold `cargo install cargo-audit` is a few more.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: graphite-core
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-09-12
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: graphite-core
      # A security product shipping unscanned dependencies is not defensible.
      # The tree includes tokio, axum, reqwest and the ed25519/curve25519
      # crypto crates — a RUSTSEC advisory against any of them must fail the
      # build, not ship silently.
      # The auditor is pinned like everything else: `--locked` fixes its
      # dependency tree, `--version` fixes the tool (Round 10).
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit dependencies for known vulnerabilities
        run: cargo audit --deny warnings
      # The runtime oracle has its own lockfile (84 crates, the agave tree).
      # It never ships, but it runs in CI on every push, so a compromised or
      # vulnerable crate in it runs on the runner (A6-05). Same auditor, same
      # `--deny warnings`, with one named exception: RUSTSEC-2025-0141
      # ("bincode is unmaintained", a warning, not a vulnerability). bincode
      # 1.3.3 is a DIRECT dependency on purpose: the runtime's packet decoder
      # is bincode 1 with fixint encoding, and the oracle must decode exactly
      # as the validator does. Any other warning or any vulnerability fails.
      - name: Audit the runtime oracle's dependencies
        working-directory: tools/runtime-oracle
        run: cargo audit --deny warnings --ignore RUSTSEC-2025-0141
      # The inner-instruction oracle (Round 35) has its own lockfile too, with
      # Agave's `solana-transaction-status`; same auditor, same one exception
      # (that crate decodes System instructions with bincode 1, as the program
      # does).
      - name: Audit the inner-instruction oracle's dependencies
        working-directory: tools/inner-instruction-oracle
        run: cargo audit --deny warnings --ignore RUSTSEC-2025-0141
      # Round 39: the fuzz harness's own lockfile (graphite-core/fuzz/Cargo.lock,
      # 204 crates) is built and run by assurance.yml on every pull request,
      # and was the one Cargo lockfile no job audited. No exception.
      - name: Audit the fuzz harness's dependencies
        working-directory: graphite-core/fuzz
        run: cargo audit --deny warnings
      # The six npm lockfiles (A6-05): the agent guard (the signing path),
      # the AI SDK tools, the MCP server, the SAK adapter, the TypeScript SDK
      # and the dashboard. `npm audit` reads the lockfile and asks the
      # registry; nothing is installed, so no install script runs here. Its
      # own exit status is not the gate: gate.mjs is. It fails on any
      # moderate, high or critical advisory that is not named in that
      # package's allowlist (moderate is gated since Round 29; it used to be
      # high/critical only), on a listed one that has gone away, and on a
      # report that is an npm error rather than an audit (fail closed). The
      # SAK tree carries known advisories with no non-breaking fix, so a bare
      # `--audit-level=moderate` would be permanently red; the allowlists in
      # .github/npm-audit/ say what each one is and where it comes from.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
      # The gate's own failure modes (an unlisted advisory, a stale or
      # undated allowlist entry, an npm error instead of a report) are tested
      # before it is trusted with the six reports below.
      - name: npm advisory gate — its own tests
        working-directory: .
        run: node --test .github/npm-audit/gate.test.mjs
      - name: npm advisories — agent guard, AI SDK tools, MCP server, SAK adapter, TypeScript SDK, dashboard
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          status=0
          for pkg in integrations/agent-guard:agent-guard \
                     integrations/vercel-ai:vercel-ai \
                     integrations/mcp-server:mcp-server \
                     integrations/solana-agent-kit:solana-agent-kit \
                     sdk/typescript:sdk-typescript \
                     dashboard:dashboard; do
            dir=${pkg%%:*}; list=${pkg##*:}
            echo "::group::npm audit ${dir}"
            # npm audit exits 1 whenever it finds anything, listed or not;
            # the report is judged by gate.mjs below, never by this status.
            (cd "$dir" && npm audit --json > "$RUNNER_TEMP/audit-$list.json") && rc=0 || rc=$?
            echo "npm audit exit ${rc}"
            node .github/npm-audit/gate.mjs "$RUNNER_TEMP/audit-$list.json" ".github/npm-audit/$list.allow" || status=1
            echo "::endgroup::"
          done
          exit $status

  runtime-oracle:
    name: Parser vs the Solana runtime decoder
    runs-on: ubuntu-24.04
    # ~1.5 min warm; a cold build of the agave crates plus two seeds of
    # ~628,500 frames each fits well inside 30.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/runtime-oracle
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-09-12
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/runtime-oracle
      # The oracle is the referee for the parser, so it is held to the same
      # hygiene as the code it judges (A6-06). `cargo fmt` without `--all`:
      # `--all` would descend into the graphite-core path dependency, which
      # the rust job already checks.
      - name: Format
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      # The runtime is the authority on what a transaction is, not web3.js.
      # This decodes the recorded corpus and its mutations, the reserved-key
      # frames, `--iterations` generated legacy/v0 frames, the v1 systematic
      # pass and `--iterations` generated v1 frames — ~628,500 frames per
      # seed at 300,000 — with the agave crates exactly as a validator's
      # packet path does, and fails on any byte string Graphite parses that
      # the runtime refuses, or reads differently (Round 12). Its own
      # workspace and lockfile: the agave tree never reaches the shipped
      # binary or the audited graphite-core lockfile.
      - name: Run the oracle over the corpus and ~628,500 frames (300,000 legacy/v0 + 300,000 v1 + systematic)
        run: cargo run --release --locked -- --iterations 300000
      # A second seed, so the property is not a fact about one sequence.
      - name: Run the oracle under a second seed
        run: cargo run --release --locked -- --iterations 300000 --seed 20260916

  # Round 35: Agave's `simulateTransaction` reports inner instructions only in
  # parsed form, and `graphite_core::parsed_inner` rebuilds their bytes. This
  # checks every rebuild against Agave's own parser: random System, SPL Token,
  # Token-2022 and ATA instructions, packed by the programs' interface crates,
  # parsed by `solana-transaction-status` (the version mainnet RPCs run),
  # rebuilt, parsed again; the JSON must round-trip, every canonical
  # instruction must come back byte for byte, and every supported type must
  # be rebuilt. Its own workspace and lockfile, like the runtime oracle.
  inner-instruction-oracle:
    name: Parsed inner instructions vs Agave's parser
    runs-on: ubuntu-24.04
    # ~2 min cold for the agave crates; each run is ~20 s per million.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/inner-instruction-oracle
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-09-12
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/inner-instruction-oracle
      - name: Format
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run the oracle (1,000,000 instructions, 30% with random data or extra accounts)
        run: cargo run --release --locked -- --iterations 1000000
      - name: Run the oracle under a second seed, mostly random
        run: cargo run --release --locked -- --iterations 500000 --seed 20260916 --fuzz-percent 90

  container:
    name: Container — build + live smoke test
    runs-on: ubuntu-24.04
    # ~2.7 min on runs #157-#158; the image build is uncached on a fresh
    # runner, and the Go live step adds a toolchain setup. 30 is ample.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Dockerfile/compose stack is the documented one-command deploy
      # path, but nothing gated it before: a Dockerfile-breaking change (or a
      # regression in the /data ownership or the bind/auth interlock) could
      # merge with a fully green CI. This builds the actual artifact and
      # proves it serves traffic.
      - name: Build image
        run: docker build -t graphite-core:ci .
      - name: Run container
        run: |
          docker run -d --name graphite-ci \
            -e GRAPHITE_API_KEY=ci-smoke-test-key-0123456789abcdef \
            -p 7331:7331 graphite-core:ci
      - name: Wait for health
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:7331/health >/dev/null; then
              echo "healthy after ${i} attempts"; exit 0
            fi
            sleep 3
          done
          echo "container never became healthy"; docker logs graphite-ci; exit 1
      - name: Durability probe — audit trail must actually be written
        run: |
          # Regression gate for the container /data ownership bug: a server
          # that cannot write its audit log must not have started at all.
          docker exec graphite-ci sh -c 'touch /data/.ci-probe && rm /data/.ci-probe' \
            || { echo "FAIL: /data not writable by the container user"; docker logs graphite-ci; exit 1; }
      - name: Auth must be enforced
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:7331/verify \
            -H 'content-type: application/json' -d '{}')
          if [ "$code" != "401" ]; then
            echo "FAIL: unauthenticated /verify returned $code, expected 401"
            docker logs graphite-ci; exit 1
          fi
      # The TypeScript SDK's real-server conformance tests skip when
      # GRAPHITE_URL is unset, so until Round 11 they never ran anywhere in
      # CI: the SDK and the server could disagree about a field name or a
      # verdict's meaning with a fully green pipeline. The container is a
      # live server; point the SDK at it.
      # Exact release, not a floating major (A6-08): 22.23.3, the current
      # 22.x LTS (nodejs.org/dist/index.json), on every Node job. Node 20
      # reached end of life in April 2026.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
      - name: TypeScript SDK conformance against the live container
        working-directory: sdk/typescript
        # `shell: bash` runs the script as `bash --noprofile --norc -eo
        # pipefail`. The default (`bash -e`) has no pipefail, so
        # `npm test | tee` took tee's status, always 0, and failing live tests
        # passed this step (A6-01). The explicit `set -o pipefail` keeps that
        # true if the shell line is ever edited.
        shell: bash
        env:
          GRAPHITE_URL: http://localhost:7331
          GRAPHITE_API_KEY: ci-smoke-test-key-0123456789abcdef
          # Node 23+ prints the `spec` reporter even into a pipe; the
          # assertions below read TAP, so ask for TAP explicitly.
          NODE_OPTIONS: --test-reporter=tap
        run: |
          set -euo pipefail
          # `--ignore-scripts` (A6-09): no dependency lifecycle script runs
          # on the runner. The SDK needs none: tsx finds esbuild's platform
          # binary through its optional dependency, not a postinstall.
          npm ci --ignore-scripts
          npm test 2>&1 | tee sdk-live.log
          # A green exit is necessary, not sufficient. The TAP summary must
          # show every test passing and nothing skipped, cancelled or todo:
          # a wrong URL or an unset key would otherwise pass vacuously.
          tap() { sed -n -E "s/^# $1 ([0-9]+)$/\1/p" sdk-live.log | tail -n 1; }
          tests=$(tap tests); pass=$(tap pass)
          for k in fail cancelled skipped todo; do
            if [ "$(tap "$k")" != "0" ]; then
              echo "::error::SDK live conformance: '# $k' is '$(tap "$k")', expected 0"; exit 1
            fi
          done
          if [ -z "$tests" ] || [ "$tests" -lt 1 ] || [ "$pass" != "$tests" ]; then
            echo "::error::SDK live conformance: $pass of $tests tests passed"; exit 1
          fi
          if grep -qE "# (SKIP|TODO)" sdk-live.log; then
            echo "::error::SDK live conformance tests were skipped"; exit 1
          fi
          # And the live tests specifically must be among the passes, by
          # name. The names come from the test file itself, so adding a
          # hermetic or a live test needs no edit here, and no count is
          # pinned that could drift.
          sed -n -E 's/^ok [0-9]+ - (.*)$/\1/p' sdk-live.log > sdk-live.passed
          grep -oE '^live\("[^"]+"' src/live-server.test.ts | sed -E 's/^live\("//; s/"$//' > sdk-live.expected
          n=$(wc -l < sdk-live.expected)
          if [ "$n" -lt 1 ]; then
            echo "::error::found no live(...) tests in src/live-server.test.ts"; exit 1
          fi
          while IFS= read -r name; do
            if ! grep -qxF -- "$name" sdk-live.passed; then
              echo "::error::live test did not pass: $name"; exit 1
            fi
          done < sdk-live.expected
          echo "SDK: $pass/$tests passed, including all $n live-server tests"
      # The Go SDK's real-server tests sit behind `//go:build liveserver`, so
      # the Go job (no server, no tag) never compiles them (A6-02). Same
      # container, same throwaway key, same toolchain pin as the Go job.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          # sdk/go has no dependencies and no go.sum to key a cache on.
          cache: false
      - name: Go SDK conformance against the live container
        working-directory: sdk/go
        shell: bash
        env:
          GRAPHITE_URL: http://localhost:7331
          GRAPHITE_API_KEY: ci-smoke-test-key-0123456789abcdef
        run: |
          set -euo pipefail
          # `-count=1`: a cached result from an earlier run is not a
          # conversation with this container.
          go test -tags liveserver -count=1 -v ./... 2>&1 | tee go-live.log
          # `t.Skip` passes `go test`; here a skip is a failure.
          if grep -qE -- "--- (SKIP|FAIL)" go-live.log; then
            echo "::error::Go SDK live conformance: a test was skipped or failed"; exit 1
          fi
          grep -oE '^func (TestLive[A-Za-z0-9_]+)' live_server_test.go | sed 's/^func //' > go-live.expected
          n=$(wc -l < go-live.expected)
          if [ "$n" -lt 1 ]; then
            echo "::error::found no TestLive* functions in live_server_test.go"; exit 1
          fi
          while IFS= read -r name; do
            if ! grep -qE -- "--- PASS: ${name} \(" go-live.log; then
              echo "::error::live test did not pass: $name"; exit 1
            fi
          done < go-live.expected
          echo "Go SDK: all $n live-server tests passed"
      - name: A keyless container must refuse to start
        run: |
          # Authenticated by default (2026-09-12): no GRAPHITE_API_KEY means no
          # start, and GRAPHITE_DEV_MODE=1 permits keyless only on loopback —
          # which the container's 0.0.0.0 bind is not. Both must exit non-zero
          # with the refusal in their logs, never serve traffic.
          #
          # Foreground, so bounded (A6-03): a regression that lets a keyless
          # container START would otherwise block here until the job timeout,
          # red but slow and unexplained. 60 s is far beyond a refusal, which
          # happens before the listener binds. `timeout` exits 124 when it
          # had to stop the run (137 if TERM was ignored and it sent KILL).
          for env in "" "-e GRAPHITE_DEV_MODE=1"; do
            docker rm -f graphite-keyless >/dev/null 2>&1 || true
            set +e
            # $env is split on purpose: "" adds nothing, the other adds -e and its value.
            # shellcheck disable=SC2086
            timeout --kill-after=10 60 docker run --name graphite-keyless $env graphite-core:ci
            code=$?
            set -e
            logs=$(docker logs graphite-keyless 2>&1 || true)
            if [ "$code" = "124" ] || [ "$code" = "137" ]; then
              echo "FAIL: keyless container ($env) was still running after 60 s: it started instead of refusing"
              echo "$logs"; exit 1
            fi
            if [ "$code" = "0" ]; then
              echo "FAIL: keyless container ($env) exited 0"; echo "$logs"; exit 1
            fi
            if ! echo "$logs" | grep -q "refusing to"; then
              echo "FAIL: keyless container ($env) did not name the refusal"; echo "$logs"; exit 1
            fi
            echo "keyless ($env): refused with exit $code"
          done
          docker rm -f graphite-keyless >/dev/null 2>&1 || true
      # Round 29 (audit 2026-10-20, C2): the compose file's hardening —
      # read-only root filesystem, every capability dropped,
      # no-new-privileges, resource limits, the fixed user, loopback-only
      # publish, the registry state on the volume — was documented and
      # never exercised: `docker run` above uses none of it. The documented
      # deploy path is validated and brought up as written, and the
      # hardening is read back from the running container.
      - name: Compose — the documented deploy path, validated and run
        shell: bash
        env:
          GRAPHITE_API_KEY: ci-compose-test-key-0123456789abcdef
        run: |
          set -euo pipefail
          docker rm -f graphite-ci >/dev/null 2>&1 || true   # free port 7331
          # compose reads .env (env_file); the template is what an operator
          # copies, so it is what CI runs.
          cp .env.example .env
          # A missing key must stop compose before anything starts.
          if GRAPHITE_API_KEY='' docker compose config >/dev/null 2>&1; then
            echo "::error::docker compose config accepted an empty GRAPHITE_API_KEY"; exit 1
          fi
          docker compose config --quiet
          docker compose config --format json > "$RUNNER_TEMP/compose.json"
          python3 - "$RUNNER_TEMP/compose.json" <<'PY'
          import json, sys
          svc = json.load(open(sys.argv[1]))["services"]["graphite"]
          checks = {
              "read_only": svc.get("read_only") is True,
              "cap_drop ALL": svc.get("cap_drop") == ["ALL"],
              "no-new-privileges": "no-new-privileges:true" in (svc.get("security_opt") or []),
              "user 10001:10001": svc.get("user") == "10001:10001",
              "memory limit": bool(svc["deploy"]["resources"]["limits"].get("memory")),
              "pids limit": bool(svc["deploy"]["resources"]["limits"].get("pids")),
              "published on loopback only": all(p.get("host_ip") == "127.0.0.1" for p in svc["ports"]),
              "registry state on the volume": svc["environment"]["GRAPHITE_REGISTRY_STATE"].startswith("/data/"),
              # Round 30: a degraded node is unhealthy, and shutdown has room
              # to drain and write its last snapshot before the SIGKILL.
              "strict healthcheck": "--strict" in (svc.get("healthcheck") or {}).get("test", []),
              "stop grace >= 30s": svc.get("stop_grace_period") in ("30s", "30000000000"),
          }
          bad = [k for k, ok in checks.items() if not ok]
          if bad:
              sys.exit(f"compose hardening missing: {bad}")
          print("compose hardening present:", ", ".join(checks))
          PY
          docker compose up -d --build
          cid=$(docker compose ps -q graphite)
          for i in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Health.Status}}' "$cid")
            if [ "$state" = "healthy" ]; then echo "compose service healthy after ${i} checks"; break; fi
            if [ "$i" = "30" ]; then
              echo "::error::compose service never became healthy ($state)"; docker compose logs; exit 1
            fi
            sleep 3
          done
          # The hardening as the engine applied it, not as the file says.
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$cid")" = "true"
          docker inspect -f '{{json .HostConfig.CapDrop}}' "$cid" | grep -q ALL
          docker inspect -f '{{json .HostConfig.SecurityOpt}}' "$cid" | grep -q no-new-privileges
          test "$(docker inspect -f '{{.Config.User}}' "$cid")" = "10001:10001"
          test "$(docker inspect -f '{{.Config.WorkingDir}}' "$cid")" = "/data"
          # It serves, behind its key, on loopback.
          curl -sf http://127.0.0.1:7331/health >/dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7331/api/graph)
          test "$code" = "401" || { echo "::error::unauthenticated /api/graph returned $code"; exit 1; }
          curl -sf -H "Authorization: Bearer ${GRAPHITE_API_KEY}" http://127.0.0.1:7331/api/graph >/dev/null
          # The root filesystem is read-only and the volume is writable (K1).
          if docker compose exec -T graphite sh -c 'touch /registry_state.json' 2>/dev/null; then
            echo "::error::the container's root filesystem is writable"; exit 1
          fi
          docker compose exec -T graphite sh -c 'touch /data/.ci-probe && rm /data/.ci-probe'
          # Round 30: the audit trail outlives the container, and a stop is
          # a clean SIGTERM shutdown (exit 0), not the SIGKILL at the end of
          # the grace period. A real verification writes the record.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GRAPHITE_API_KEY}" -H 'content-type: application/json' \
            --data-binary @examples/verify-input.json http://127.0.0.1:7331/verify)
          test "$code" = "200" || { echo "::error::/verify returned $code"; exit 1; }
          before=$(docker compose exec -T graphite sh -c 'wc -l < /data/audit.jsonl')
          test "$before" -ge 1 || { echo "::error::the verification left no audit record"; exit 1; }
          docker compose stop graphite
          test "$(docker inspect -f '{{.State.ExitCode}}' "$cid")" = "0" \
            || { echo "::error::the server did not exit 0 on SIGTERM"; docker compose logs; exit 1; }
          # To a file, not a pipe: under pipefail, `grep -q` closing the pipe
          # early would fail the step on SIGPIPE.
          docker compose logs graphite > "$RUNNER_TEMP/compose-stop.log"
          grep -q 'SIGTERM' "$RUNNER_TEMP/compose-stop.log"
          docker compose up -d --no-build --force-recreate
          cid=$(docker compose ps -q graphite)
          for i in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Health.Status}}' "$cid")
            if [ "$state" = "healthy" ]; then break; fi
            if [ "$i" = "30" ]; then echo "::error::recreated service never became healthy ($state)"; exit 1; fi
            sleep 3
          done
          after=$(docker compose exec -T graphite sh -c 'wc -l < /data/audit.jsonl')
          test "$after" -ge "$before" || { echo "::error::audit records lost across a recreate ($before -> $after)"; exit 1; }
          echo "audit trail persisted across a recreate: $before -> $after records"
          docker compose down -v
      - name: Container logs
        if: always()
        run: |
          docker logs graphite-ci || true
          docker compose logs || true
      - name: Cleanup
        if: always()
        run: |
          docker rm -f graphite-ci graphite-keyless || true
          docker compose down -v || true

  typescript:
    name: TypeScript SDK, agent guard + framework adapters
    runs-on: ubuntu-24.04
    # ~1 min warm; the SAK adapter's tree is ~1,300 packages, so a cold
    # install is the long pole. 20 is generous.
    timeout-minutes: 20
    # Round 30: every `npm test` below is node:test (via tsx), read back by
    # .github/scripts/test-count.sh from its TAP summary, so a glob that
    # stops matching (zero tests, exit 0) or a test turned into a skip fails
    # the step. Floors are the counts at 29e4356.
    env:
      NODE_OPTIONS: --test-reporter=tap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
      - name: SDK typecheck + AuditBind cross-language parity
        working-directory: sdk/typescript
        run: |
          # `npm ci` alone: the previous `npm ci || npm install` fallback
          # meant a lockfile problem silently downgraded the job to
          # unpinned resolution, which is the failure mode the lockfile
          # exists to prevent. `--ignore-scripts` (A6-09): see the container
          # job; the SDK has no install step it needs.
          npm ci --ignore-scripts
          npm run check
          # Pins the TS content_hash to the SAME vectors the Rust core and the
          # Go SDK assert. If any of the three implementations drifts, the
          # TOCTOU check silently stops matching — so this must gate.
          # Uses the declared `test` script (tsx is a pinned devDependency)
          # rather than `npx tsx`, which would fetch an unpinned version from
          # the network at job time.
          # The live-server tests skip without a server (the container job
          # runs them against one); nothing else may skip.
          npm test 2>&1 | tee "$RUNNER_TEMP/sdk-ts.log"
          bash ../../.github/scripts/test-count.sh tap "$RUNNER_TEMP/sdk-ts.log" 68 \
            "$(grep -cE '^live\("' src/live-server.test.ts)"
          # The published package must actually build, and must not ship the
          # test file — dist/ is gitignored, so a broken build config would
          # otherwise only surface at publish time.
          npm run build
      - name: Agent guard typecheck, tests, and the cross-language corpus
        working-directory: integrations/agent-guard
        run: |
          # The framework-independent guard (R-P8 phase 3): the one package
          # that holds the signing key in every integration. `npm ci` for the
          # lockfile, `npm run` for the binaries: `npx tsc` and `npx tsx`
          # would fetch whatever version resolves at job time.
          # `--ignore-scripts` (A6-09): nothing here needs an install script.
          npm ci --ignore-scripts
          npm run typecheck
          # Every *.test.ts in the directory, so a test file cannot sit in
          # the repository looking like a gate without ever running.
          npm test 2>&1 | tee "$RUNNER_TEMP/agent-guard.log"
          bash ../../.github/scripts/test-count.sh tap "$RUNNER_TEMP/agent-guard.log" 343
          # The guard and the Rust Core are two implementations of one
          # agreement: the guard serializes a transaction and describes its
          # instructions, the Core reads both and decides whether they agree.
          # `sak_bridge_artifact.json` and `sak_bridge_corpus.json` are the
          # TypeScript side's real output and the Rust suite asserts against
          # them, so they are regenerated from the code rather than kept in
          # step by hand. Any drift shows up as a diff here instead of as a
          # blocked transaction in production.
          npm run emit:artifact-fixture
          npm run emit:corpus
          git diff --exit-code -- \
            ../../graphite-core/fixtures/artifacts/sak_bridge_artifact.json \
            ../../graphite-core/fixtures/artifacts/sak_bridge_corpus.json
      - name: Vercel AI SDK tools typecheck + tests
        working-directory: integrations/vercel-ai
        run: |
          # Imports the guard's sources (installed above). The tests run the
          # tools inside the AI SDK's own tool loop with its scripted test
          # model and loopback stand-ins: no hosted model, no network.
          npm ci --ignore-scripts
          npm run typecheck
          npm test 2>&1 | tee "$RUNNER_TEMP/vercel-ai.log"
          bash ../../.github/scripts/test-count.sh tap "$RUNNER_TEMP/vercel-ai.log" 12
      - name: MCP server typecheck + tests
        working-directory: integrations/mcp-server
        run: |
          # Includes the stdio server started as its own process, which
          # fails if any log line reaches the protocol on stdout.
          npm ci --ignore-scripts
          npm run typecheck
          npm test 2>&1 | tee "$RUNNER_TEMP/mcp-server.log"
          bash ../../.github/scripts/test-count.sh tap "$RUNNER_TEMP/mcp-server.log" 12
      - name: SAK adapter typecheck + tests
        working-directory: integrations/solana-agent-kit
        run: |
          # The adapter imports the guard's sources from ../agent-guard, which
          # resolve their dependencies from the guard's own node_modules
          # (installed in the step above).
          #
          # `--ignore-scripts` (A6-09): this tree has lifecycle scripts in
          # usb, node-hid, secp256k1, keccak, bufferutil, protobufjs, esbuild
          # and more. None is needed: the native ones fall back to pure JS or
          # are never loaded by the tests.
          npm ci --ignore-scripts
          npm run typecheck
          npm test 2>&1 | tee "$RUNNER_TEMP/sak.log"
          bash ../../.github/scripts/test-count.sh tap "$RUNNER_TEMP/sak.log" 11

  # Round 40 (R39-CLIENTS-6, G2-6): the guard's Windows behaviour was
  # "reasoned, not run". On Windows the guard checks the KINDS of its lock
  # directory and state file (a link or the wrong kind refuses) but not their
  # owner or access, which live in an ACL Node cannot read; the default lock
  # directory is <profile>\AppData\Local\graphite-guard. This job runs the
  # guard's typecheck and whole test suite there. The tests that need POSIX
  # modes or uids skip with their reason through `posixOnly` (posix-only.ts),
  # and this job allows exactly as many skips as there are uses of it, read
  # from the sources; guard-round40.test.ts runs the Windows branches (a link
  # or a file as the lock directory, a directory or a link as the state file,
  # owner and access unchecked and said so). A pinned image, like every job
  # here (A6-08), rather than the moving `windows-latest`.
  agent-guard-windows:
    name: Agent guard — Windows (typecheck, tests)
    runs-on: windows-2025
    # The guard's suite takes ~1 min on Linux; Windows file operations and a
    # cold npm install are slower. 30 leaves room.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: integrations/agent-guard
        shell: bash
    env:
      NODE_OPTIONS: --test-reporter=tap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
      - name: Agent guard typecheck and tests on Windows
        run: |
          set -euo pipefail
          # .gitattributes checks every text file out LF on Windows too, so
          # the corpora and fixtures the tests read are the bytes Linux reads.
          npm ci --ignore-scripts
          npm run typecheck
          log="$(cygpath -u "$RUNNER_TEMP")/agent-guard-windows.log"
          npm test 2>&1 | tee "$log"
          # Exactly the tests marked POSIX-only may skip (each says why in
          # the TAP output); any other skip, or a marked test that stopped
          # existing while the count stayed, fails. 348 tests at Round 40,
          # 3 of them POSIX-only.
          posix_only="$(cat ./*.test.ts | grep -o '{ skip: posixOnly(' | wc -l)"
          echo "POSIX-only tests skipped on Windows: $posix_only"
          bash ../../.github/scripts/test-count.sh tap "$log" 345 "$posix_only"
          skipped="$(sed -n -E 's/^# skipped ([0-9]+)$/\1/p' "$log" | tail -n 1)"
          if [ "${skipped:-0}" != "$posix_only" ]; then
            echo "::error::$skipped tests skipped on Windows, $posix_only are marked POSIX-only"; exit 1
          fi

  go:
    name: Go SDK — fmt, vet, tests
    runs-on: ubuntu-24.04
    # Under a minute; no dependencies to fetch.
    timeout-minutes: 15
    # Both Go releases that still get security fixes: the module's floor
    # (go.mod `go 1.26`) and the newest. Go 1.22, tested until 2026-09-30,
    # had been out of support since 2025.
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.10", "1.27.3"]
    defaults:
      run:
        working-directory: sdk/go
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Exact patch releases, not floating minors (Round 10).
          go-version: ${{ matrix.go }}
      # Mirrors the Rust job's `cargo fmt --check`. gofmt exits 0 whether or
      # not it finds anything, so the check is on its OUTPUT being empty —
      # and the unformatted file list is printed before failing, so the fix
      # is obvious from the log alone.
      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files. Run 'gofmt -w sdk/go/'"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      # `-count=1 -v` (Round 30): each top-level test is named in the log,
      # which test-count.sh reads; `go test` exits 0 for a package with no
      # test file, so a floor is the only way an emptied suite fails. The
      # live-server tests are behind the `liveserver` tag (container job).
      - name: Tests
        run: |
          go test -count=1 -v ./... 2>&1 | tee "$RUNNER_TEMP/go-test.log"
          bash ../../.github/scripts/test-count.sh go "$RUNNER_TEMP/go-test.log" 66

  dashboard:
    name: Dashboard — typecheck, tests + production build
    runs-on: ubuntu-24.04
    # Under a minute warm.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 22: the dashboard declares `engines.node >=22`; its unit tests
          # run under tsx (`tsx --test`, a pinned devDependency) with
          # node:test. Exact release (A6-08): the current 22.x LTS on
          # 2026-09-30.
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install
        # `--ignore-scripts` (A6-09). The dependencies with install scripts
        # are fsevents (macOS only, never installed here) and esbuild, whose
        # postinstall only verifies the platform
        # binary it already gets from its optional dependency; typecheck,
        # tests and `vite build` all pass without it.
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        env:
          NODE_OPTIONS: --test-reporter=tap
        run: |
          npm test 2>&1 | tee "$RUNNER_TEMP/dashboard.log"
          bash ../.github/scripts/test-count.sh tap "$RUNNER_TEMP/dashboard.log" 48
      - name: Build
        run: npm run build
      # Round 29 (audit 2026-10-20, D6): what the build ships. No source
      # maps, and a Content-Security-Policy that runs only the console's own
      # scripts.
      - name: The build ships a CSP and no source maps
        run: |
          if [ -n "$(find dist -name '*.map')" ]; then
            echo "::error::the production build ships source maps"; find dist -name '*.map'; exit 1
          fi
          grep -q 'http-equiv="Content-Security-Policy"' dist/index.html
          grep -q "script-src &#39;self&#39;;" dist/index.html

  python:
    name: Python AI layer + mainnet-sample tools — tests
    runs-on: ubuntu-24.04
    # Seconds; five hash-pinned wheels.
    timeout-minutes: 15
    # The oldest supported Python the layer runs on (3.11, supported to
    # 2027-10) and a newer one (3.13, to 2029-10), so the advisory layer is
    # known to run on what deployments will move to. The locked wheels are
    # pure Python.
    strategy:
      fail-fast: false
      matrix:
        # Exact releases, like every other toolchain here (A6-08); a minor
        # alone resolved to whatever patch the runner had that day (W23).
        python: ["3.11.17", "3.13.16"]
    defaults:
      run:
        working-directory: python-ai-layer
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # Hash-locked: every wheel's SHA-256 is in the lock file, so the index
      # cannot substitute a package (Round 10).
      - name: Install test deps
        run: pip install --require-hashes -r requirements-lock.txt
      # pytest already fails when it collects nothing (exit 5); the floor
      # also catches a suite that shrank (Round 30).
      - name: Tests
        run: |
          pytest -q 2>&1 | tee "$RUNNER_TEMP/pytest-ai.log"
          bash ../.github/scripts/test-count.sh pytest "$RUNNER_TEMP/pytest-ai.log" 51
      # Round 29 (audit 2026-10-20, M1-M3): the sample fetcher and the
      # row-by-row verifier, against a stand-in endpoint (no network).
      - name: mainnet-sample tool tests
        working-directory: tools/mainnet-sample
        run: |
          pytest -q -p no:cacheprovider test_mainnet_sample.py 2>&1 | tee "$RUNNER_TEMP/pytest-sample.log"
          bash ../../.github/scripts/test-count.sh pytest "$RUNNER_TEMP/pytest-sample.log" 7
      # Round 32: the live-measurement runners' own logic (report shapes,
      # rate-limit detection, L8 outcome classes, simulator-error reasons, the
      # blockhash rewrite on committed mainnet bytes, the local-validator
      # fallback), against stand-ins.
      - name: live-measure tool tests
        working-directory: tools/live-measure
        run: |
          pytest -q -p no:cacheprovider test_live_measure.py 2>&1 | tee "$RUNNER_TEMP/pytest-live.log"
          bash ../../.github/scripts/test-count.sh pytest "$RUNNER_TEMP/pytest-live.log" 83
      # W23 (external review): the other lockfiles were audited and this one
      # was not. Every pin is exact and hashed, so no resolution is needed.
      - name: Advisory audit of the lockfile
        if: matrix.python == '3.13.16'
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: python-ai-layer/requirements-lock.txt
          require-hashes: true
          no-deps: true

  # Round 30 (K-20): Cargo.toml declares `rust-version = "1.89"`, and nothing
  # built on 1.89 — every job uses 1.99.1 — so the declaration was a claim.
  # Measured 2026-10-21: `cargo +1.89.0 check --locked` passes for the
  # all-features and the featureless library. This keeps it true: a change
  # that needs a newer compiler must raise rust-version in the same diff.
  msrv:
    name: Rust core — declared MSRV (1.89) builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: graphite-core
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-09-12
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: graphite-core
          key: msrv
      - name: The declared rust-version matches this job's toolchain
        run: grep -qx 'rust-version = "1.89"' Cargo.toml
      - name: Check, all features
        run: cargo check --locked --all-features
      - name: Check, no features (embedded-use contract)
        run: cargo check --locked --no-default-features

  # Round 32: the console drawn in a browser against a live Core. The
  # dashboard job type-checks, unit-tests and builds the console, but nothing
  # drew a page: whether the production build renders, obeys its own CSP,
  # fits a phone, passes axe, and draws green only what the Core reported
  # executable was checked by hand (dashboard/e2e/smoke.mjs, Round 30). The
  # whole run is .github/scripts/dashboard-e2e.sh, which a contributor runs
  # locally unchanged.
  dashboard-e2e:
    name: Dashboard — browser smoke against a live Core
    runs-on: ubuntu-24.04
    # A release build of the Core (~5 min warm, longer cold), the console
    # build, a Chromium download, 80 smoke page walks (Round 39: five sizes)
    # and the fault-state walks. 45 leaves a cold cache room.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The compiler the rust job certifies and the container ships with.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-09-12
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: graphite-core
      - name: Build the Core
        # The features and flags of the shipped binary (Dockerfile).
        run: cargo build --manifest-path graphite-core/Cargo.toml --locked --release --features server,cli --bin graphite
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            dashboard/e2e/package-lock.json
      - name: Build the console
        working-directory: dashboard
        # `--ignore-scripts` (A6-09), as in the dashboard job.
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Install Playwright, its Chromium, and axe-core
        working-directory: dashboard/e2e
        # Exact versions, with integrity hashes, from dashboard/e2e's own
        # lockfile; the console does not depend on them. Then Playwright's
        # supported install: the Chromium build this Playwright release is
        # tested against, and the system libraries it needs.
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
      # The seventh npm lockfile, held to the supply-chain job's gate and its
      # rules (.github/npm-audit/dashboard-e2e.allow).
      - name: npm advisories — the smoke's own dependencies
        run: |
          (cd dashboard/e2e && npm audit --json > "$RUNNER_TEMP/audit-dashboard-e2e.json") && rc=0 || rc=$?
          echo "npm audit exit ${rc}"
          node .github/npm-audit/gate.mjs "$RUNNER_TEMP/audit-dashboard-e2e.json" .github/npm-audit/dashboard-e2e.allow
      - name: Browser smoke (seeded Core, every view, desktop and phone, axe)
        run: .github/scripts/dashboard-e2e.sh graphite-core/target/release/graphite

  # Round 32: the deployment kit (deploy/) checked by its own tools and run
  # against a live Core and Caddy on loopback — the Caddy route allow-list,
  # the Prometheus rules and their unit tests, the systemd unit's exposure,
  # the compose file, and the backup / restore / anchoring / key-rotation
  # scripts. deploy/tests/run.sh exits non-zero on any failed check.
  deploy:
    name: Deploy kit — static checks and loopback run
    runs-on: ubuntu-24.04
    # A release build of the Core plus two Go builds; 45 leaves a cold cache room.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-09-12
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: graphite-core
      - name: Build the Core
        # The features and flags of the shipped binary (Dockerfile).
        run: cargo build --manifest-path graphite-core/Cargo.toml --locked --release --features server,cli --bin graphite
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - name: Build Caddy and promtool at pinned releases
        # Caddy through the Go module proxy, whose checksum database verifies
        # every module. promtool cannot be `go install`ed (its module has
        # replace directives), so it is built from the release tag, and the
        # tag must resolve to the pinned commit.
        env:
          CADDY_VERSION: v2.11.7
          PROMETHEUS_TAG: v3.15.1
          PROMETHEUS_COMMIT: bae3eced0a5369e050e83ea73bc381d7c4b1a719
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/deploy-bin"
          mkdir -p "$bin"
          GOBIN="$bin" go install "github.com/caddyserver/caddy/v2/cmd/caddy@$CADDY_VERSION"
          git clone -q -c advice.detachedHead=false --depth 1 --branch "$PROMETHEUS_TAG" \
            https://github.com/prometheus/prometheus "$RUNNER_TEMP/prometheus"
          got="$(git -C "$RUNNER_TEMP/prometheus" rev-parse HEAD)"
          if [ "$got" != "$PROMETHEUS_COMMIT" ]; then
            echo "::error::$PROMETHEUS_TAG resolved to $got, pinned $PROMETHEUS_COMMIT"; exit 1
          fi
          (cd "$RUNNER_TEMP/prometheus" && go build -o "$bin/promtool" ./cmd/promtool)
          "$bin/caddy" version
          "$bin/promtool" --version
          shellcheck --version
      - name: Deploy tests
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/deploy-bin"
          # Round 36 (F-021): the full-disk rehearsal mounts a tmpfs inside an
          # unprivileged user+mount namespace, which Ubuntu 24.04's AppArmor
          # restricts by default. Lift it for this job so the rehearsal runs
          # (the floor below counts its checks) instead of being skipped.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          GRAPHITE_BIN="$PWD/graphite-core/target/release/graphite" CADDY_BIN="$bin/caddy" \
            PROMTOOL_BIN="$bin/promtool" bash deploy/tests/run.sh 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          # Every check ran: a section that silently stopped running would
          # still exit 0 with fewer checks.
          passed="$(sed -n 's/^deploy tests: \([0-9]*\) passed, 0 failed$/\1/p' "$RUNNER_TEMP/deploy.log")"
          # 87 at Round 32; 105 at Round 34 (the archive MAC, --anchor-dir,
          # the .sha256 naming check and owner preservation across a key
          # rotation, R33-19 / D-6); 109 with the audit-key rotation under
          # GRAPHITE_AUDIT_PREVIOUS_KEY_FILE and rotate-keys.sh's exit 4
          # (R33-13 / R33-4). The owner checks need root or passwordless
          # sudo, which the hosted runner has. 162 at Round 36 (F-019 one
          # replica, F-021 rehearsals: second Core, SIGTERM in flight, full
          # disk, lost audit key; alert coverage; compose/Dockerfile checks).
          if [ -z "$passed" ] || [ "$passed" -lt 162 ]; then
            echo "::error::deploy tests: ${passed:-no summary} passed, floor 162"; exit 1
          fi

  # Round 34: the scripts the release and the live workflows run, tested
  # here because those workflows run only on a tag, a dispatch or a schedule.
  # release-gate.sh (R33-9: which CI run, which commit and which signature a
  # release accepts), set-rpc-env.sh (D-9), pinned-tools.py (R33-20: every
  # hand-pinned tool is where .github/pinned-tools.json says, and the same
  # pin everywhere, D2-6) and check-attestation-commands.py (R33-18: every
  # published verify command pins the signer workflow). Round 38: the
  # dependency holds' review-by dates (D2-7), the ruleset drift comparison
  # (R37-8), the release guard (R37-8) and the per-binary test counter (D2-8)
  # are tested here too.
  ci-scripts:
    name: Release gate and CI scripts — their own tests
    runs-on: ubuntu-24.04
    # Seconds: shell, python3, git and ssh-keygen only.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: the release gate's tests check GATE_INTRODUCED
          # against `git log --diff-filter=A` and refuse 99948c6 (R37-8); in a
          # shallow clone they fail, they do not skip.
          fetch-depth: 0
      - name: Release gate decisions (PR-event vs push-to-main CI, ancestry, tag signatures)
        run: |
          bash .github/scripts/release-gate.test.sh 2>&1 | tee "$RUNNER_TEMP/release-gate.log"
          passed="$(sed -n 's/^release-gate tests: \([0-9]*\) passed, 0 failed$/\1/p' "$RUNNER_TEMP/release-gate.log")"
          # 30 at Round 34; 52 at Round 38 (R37-8 pre-gate commits, D2-5
          # revocation and validity windows, D2-3 same-tag).
          if [ -z "$passed" ] || [ "$passed" -lt 52 ]; then
            echo "::error::release-gate tests: ${passed:-no summary} passed, floor 52"; exit 1
          fi
      - name: Hand-pinned tools are where the list says, and the same everywhere
        run: python3 .github/scripts/pinned-tools.py check-pins
      - name: Every dependency hold is listed with a review-by date not yet past
        run: python3 -I .github/scripts/dependency-holds.py check
      - name: Every published attestation command pins the signer
        run: python3 .github/scripts/check-attestation-commands.py
      # Round 40 (R39-SUPPLY-CHAIN-6): no workflow ran actionlint, and the
      # "actionlint clean" of earlier rounds was a local run of an unrecorded
      # version (1.7.7 rejects release.yml's `artifact-metadata: write`;
      # 1.7.11 is clean). The release binary at an exact version, verified
      # against the pinned sha256 before it runs (.github/pinned-tools.json).
      # Every workflow, every finding fails: no -ignore, no config file
      # (ci-scripts.test.sh checks both). shellcheck is the runner image's
      # (actionlint passes each inline `run:` block through it); pyflakes is
      # off by name because no workflow has a `shell: python` step and an
      # unpinned pyflakes would otherwise decide silently whether it ran.
      - name: actionlint (pinned) over every workflow
        env:
          ACTIONLINT_VERSION: 1.7.11
          ACTIONLINT_SHA256: 900919a84f2229bac68ca9cd4103ea297abc35e9689ebb842c6e34a3d1b01b0a
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$dir"
          curl -fsSL --retry 3 --proto '=https' -o "$dir/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $dir/actionlint.tar.gz" | sha256sum --check --strict -
          tar -xzf "$dir/actionlint.tar.gz" -C "$dir" actionlint
          "$dir/actionlint" -version
          shellcheck --version
          "$dir/actionlint" -shellcheck "$(command -v shellcheck)" -pyflakes ""
          # The scripts' own tests below seed a fault into a copy of a
          # workflow and check this binary reports it (not a no-op).
          echo "ACTIONLINT=$dir/actionlint" >> "$GITHUB_ENV"
      - name: The CI scripts' own tests
        run: |
          bash .github/scripts/ci-scripts.test.sh 2>&1 | tee "$RUNNER_TEMP/ci-scripts.log"
          passed="$(sed -n 's/^ci-scripts tests: \([0-9]*\) passed, 0 failed$/\1/p' "$RUNNER_TEMP/ci-scripts.log")"
          # 33 at Round 36; 77 at Round 38 (D2-4, D2-6, D2-7, D2-8, D-8,
          # R37-8 drift and guard, D2-3 publish structure); 121 at Round 39
          # (the live ruleset state of 2026-10-25, --require-bypass,
          # main-review required, shellcheck of these scripts, and
          # graphite-core/scripts/validate_corpora.py over the committed
          # corpora with 13 seeded faults; the live-mainnet seed pin).
          if [ -z "$passed" ] || [ "$passed" -lt 121 ]; then
            echo "::error::ci-scripts tests: ${passed:-no summary} passed, floor 121"; exit 1
          fi

  # Round 30 (G-11): the one check the `main` ruleset requires
  # (.github/rulesets/main.json). Requiring each job by name would tie the
  # ruleset to matrix labels ("Go SDK — fmt, vet, tests (1.27.3)") that change
  # with every toolchain bump, and a renamed or deleted job would quietly stop
  # being required. This job needs every other job and passes only if each of
  # them succeeded: a failure, a cancellation or a skip anywhere fails it. A
  # new job must be added to `needs` below (the ruleset then covers it).
  ci-gate:
    name: CI gate
    if: always()
    needs: [rust-lint, rust-test, ci-scripts, msrv, supply-chain, runtime-oracle, inner-instruction-oracle, container, typescript, agent-guard-windows, go, dashboard, dashboard-e2e, deploy, python]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every required job succeeded
        env:
          # Through the environment, not interpolated into the script.
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          for job, v in sorted(needs.items()):
              print(f"{job}: {v['result']}")
          bad = {job: v["result"] for job, v in needs.items() if v["result"] != "success"}
          if not needs or bad:
              print(f"::error::not every required job succeeded: {bad or 'no jobs'}")
              sys.exit(1)
          PY
