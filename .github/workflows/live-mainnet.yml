name: Live mainnet measurement

# Round 32 (P3): Graphite against recent real mainnet traffic WITH simulation.
# The committed conformance blocks run offline, so L3, L4 and the execution
# decision are never exercised on real traffic in CI. This replays recent
# transactions through a Core that has a mainnet RPC attached and reports what
# the full pipeline does with them (tools/live-measure/README.md).
#
# Manual only: it reads a public endpoint, which is somebody else's
# infrastructure. It fails on a Graphite defect (a 5xx, a contradictory
# decision, an approval that cannot be explained, the conformance invariants);
# a rate-limited endpoint is reported as INCONCLUSIVE, not as a failure.
#
# An operator RPC (a provider URL that may carry a key) goes in the
# `GRAPHITE_LIVE_RPC_URL` repository secret; it is masked, never printed, and
# scrubbed from the uploaded logs.
on:
  # workflow_dispatch works only once this file is on the default branch; on a
  # pull request, adding the `live-measure` label runs it with the defaults.
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      rpc_url:
        description: "Mainnet RPC (the GRAPHITE_LIVE_RPC_URL secret overrides it)"
        default: "https://api.mainnet-beta.solana.com"
        type: string
      transactions:
        description: "How many transactions to replay through /verify"
        default: "200"
        type: string
      blocks:
        description: "Recent blocks to sample (the conformance harness needs 500+ verdicts: 2 blocks is ~2,000)"
        default: "2"
        type: string
      pace_seconds:
        description: "Pause between /verify calls (each one makes several RPC calls)"
        default: "1.0"
        type: string
      l8_checks:
        description: "Executed transactions to reconcile through /verify/execution"
        default: "10"
        type: string

concurrency:
  group: live-mainnet-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  measure:
    name: Replay recent mainnet traffic with simulation
    if: github.event_name != 'pull_request' || github.event.label.name == 'live-measure'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      REPORT_DIR: ${{ github.workspace }}/live-report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Choose the RPC (masked; never printed)
        env:
          SECRET_RPC: ${{ secrets.GRAPHITE_LIVE_RPC_URL }}
          INPUT_RPC: ${{ inputs.rpc_url || 'https://api.mainnet-beta.solana.com' }}
        run: |
          rpc="${SECRET_RPC:-$INPUT_RPC}"
          echo "::add-mask::$rpc"
          {
            echo "LIVE_RPC_URL=$rpc"
          } >> "$GITHUB_ENV"
          R="$rpc" python3 -c 'import os,urllib.parse as u; print("rpc host:", u.urlsplit(os.environ["R"]).hostname)'
          mkdir -p "$REPORT_DIR"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-09-12
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: graphite-core
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Build the Core and the conformance harness
        working-directory: graphite-core
        run: |
          cargo build --release --locked --bin graphite
          cargo test --release --locked --test mainnet_conformance --no-run

      - name: Fetch recent finalized blocks
        id: fetch
        env:
          BLOCKS: ${{ inputs.blocks || '2' }}
        run: |
          set +e
          python3 tools/live-measure/live_mainnet.py fetch --rpc "$LIVE_RPC_URL" --blocks "$BLOCKS" --out "$RUNNER_TEMP/sample.json"
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "## Live mainnet measurement — INCONCLUSIVE" >> "$GITHUB_STEP_SUMMARY"
            echo "The endpoint refused or rate-limited the block fetch; nothing was measured. Rerun later or set the GRAPHITE_LIVE_RPC_URL secret." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # The harness builds the same /verify request for each transaction that
      # the committed conformance test builds, with the intent an honest agent
      # declares, and checks the conformance invariants on the fresh blocks.
      # Its exit status is recorded, not swallowed: the replay step turns a
      # failure into a reported defect after the measurement is written.
      - name: Conformance harness on the fresh blocks (writes the requests)
        id: harness
        if: steps.fetch.outputs.skip == 'false'
        working-directory: graphite-core
        env:
          GRAPHITE_MAINNET_SAMPLE: ${{ runner.temp }}/sample.json
          GRAPHITE_MAINNET_HONEST_INTENT: "1"
          GRAPHITE_MAINNET_REQUESTS: ${{ runner.temp }}/requests.jsonl
        run: |
          set +e
          cargo test --release --locked --test mainnet_conformance -- --ignored real_mainnet_traffic --nocapture 2>&1 | tee "$REPORT_DIR/harness.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          test -s "$GRAPHITE_MAINNET_REQUESTS" || { echo "::error::the harness wrote no requests"; exit 1; }

      - name: Pick the transactions to replay
        if: steps.fetch.outputs.skip == 'false'
        env:
          N: ${{ inputs.transactions || '200' }}
        run: python3 tools/live-measure/live_mainnet.py select --requests "$RUNNER_TEMP/requests.jsonl" --n "$N" --out "$REPORT_DIR/selected.jsonl"

      - name: Start the Core with the RPC attached
        if: steps.fetch.outputs.skip == 'false'
        run: |
          key="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$key"
          echo "GRAPHITE_API_KEY=$key" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/data"
          GRAPHITE_API_KEY="$key" GRAPHITE_DATA_DIR="$RUNNER_TEMP/data" GRAPHITE_RPC_URL="$LIVE_RPC_URL" \
            GRAPHITE_LOG_FORMAT=json \
            nohup graphite-core/target/release/graphite server --port 7331 > "$REPORT_DIR/core.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/core.pid"
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:7331/health > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "::error::the Core did not answer /health"; tail -50 "$REPORT_DIR/core.log"; exit 1

      - name: Replay through /verify, then L8 on executed transactions
        id: replay
        if: steps.fetch.outputs.skip == 'false'
        env:
          PACE: ${{ inputs.pace_seconds || '1.0' }}
          L8: ${{ inputs.l8_checks || '10' }}
          HARNESS_EXIT: ${{ steps.harness.outputs.exit }}
        run: |
          set +e
          python3 tools/live-measure/live_mainnet.py replay --selected "$REPORT_DIR/selected.jsonl" \
            --sample "$RUNNER_TEMP/sample.json" --core http://127.0.0.1:7331 --pace "$PACE" --l8 "$L8" \
            --harness-exit "$HARNESS_EXIT" --out-dir "$REPORT_DIR"
          code=$?
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          cat "$REPORT_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Stop the Core (a clean SIGTERM exit is part of the result)
        id: stop
        if: always() && steps.fetch.outputs.skip == 'false'
        run: |
          pid="$(cat "$RUNNER_TEMP/core.pid" 2>/dev/null || true)"
          if [ -z "$pid" ] || ! kill -0 "$pid" 2>/dev/null; then
            echo "clean=false" >> "$GITHUB_OUTPUT"; echo "::error::the Core was not running at the end"; exit 0
          fi
          kill -TERM "$pid"
          for _ in $(seq 1 40); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then echo "clean=false" >> "$GITHUB_OUTPUT"; kill -KILL "$pid"; else echo "clean=true" >> "$GITHUB_OUTPUT"; fi

      - name: Scrub the RPC URL from the logs before upload
        if: always()
        run: |
          python3 - "$REPORT_DIR" <<'PY'
          import os, pathlib, sys
          secret = os.environ.get("LIVE_RPC_URL", "")
          for p in pathlib.Path(sys.argv[1]).rglob("*"):
              if p.is_file() and secret:
                  t = p.read_text(errors="replace")
                  if secret in t:
                      p.write_text(t.replace(secret, "<rpc-url>"))
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: live-mainnet-report
          path: live-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Verdict
        if: steps.fetch.outputs.skip == 'false'
        env:
          REPLAY: ${{ steps.replay.outputs.exit }}
          CLEAN: ${{ steps.stop.outputs.clean }}
        run: |
          if [ "$CLEAN" != "true" ]; then echo "::error::the Core did not shut down cleanly"; exit 1; fi
          if [ "$REPLAY" != "0" ]; then echo "::error::defects found — see the job summary and the live-mainnet-report artifact"; exit 1; fi
          echo "no Graphite defect found (read the summary for INCONCLUSIVE)"
