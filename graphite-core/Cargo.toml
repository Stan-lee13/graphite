[package]
name = "graphite-core"
version = "0.2.0-beta"
edition = "2021"
description = "Graphite — Transaction verification for Solana AI agents"
license = "MIT"
# # publish = false  # Removed for public release  # Removed for public release

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
sha2 = "0.10"
bs58 = "0.5"
curve25519-dalek = "4"
hex = "0.4"
anyhow = "1"
# default-features = false is REQUIRED: reqwest 0.11's default-tls feature
# pulls native-tls → openssl-sys, which fails to build on systems without
# OpenSSL dev packages (CI containers, minimal Docker images). rustls-tls is
# the pure-Rust TLS backend.
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "gzip", "brotli", "rustls-tls"] }
base64 = "0.21"
tracing = "0.1"
# Without a subscriber installed, EVERY tracing::info!/warn!/error! call in
# this crate is a silent no-op — including audit-write failures. Found by the
# 2026-09-05 production audit; the server installs this at startup.
# `json` gives enterprise-friendly structured output; `env-filter` gives
# operators RUST_LOG control.
tracing-subscriber = { version = "0.3", optional = true, features = ["json", "env-filter"] }

# Server (feature-gated)
axum = { version = "0.8", optional = true }
tower = { version = "0.4", optional = true, features = ["limit", "util"] }
tower-http = { version = "0.6", features = ["cors", "limit", "timeout", "trace", "catch-panic"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }

# CLI (feature-gated)
clap = { version = "4", features = ["derive"], optional = true }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }

[features]
default = ["server", "cli"]
server = ["dep:axum", "dep:tokio", "dep:tower-http", "dep:tower", "dep:tracing-subscriber", "rpc"]
# cli pulls tokio: the synchronous verify() wrapper needs an async runtime,
# and the CLI's verify subcommand uses it. A no-feature LIBRARY build still
# compiles (verify() degrades to a fail-closed stub) — only the library core
# is expected to be embeddable without a runtime.
cli = ["dep:clap", "dep:tokio"]
rpc = ["dep:reqwest", "dep:tokio"]

[profile.release]
# Strip symbols from the shipped binary: smaller image, and less to work with
# for anyone who gains container access. `lto`/`codegen-units` trade build
# time for a faster, smaller verification hot path.
strip = true
lto = "thin"
codegen-units = 1

[dev-dependencies]
proptest = "1.0"

[[bin]]
name = "graphite"
path = "src/bin/graphite.rs"
required-features = ["cli"]

[profile.test]
opt-level = 2
