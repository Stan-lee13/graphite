[package]
name = "graphite-core"
version = "0.3.0-beta"
edition = "2021"
# The oldest toolchain the code builds on: `std::fs::File::lock` (the data
# directory and registry locks) is stable since 1.89 (audit 2026-10-20).
rust-version = "1.89"
description = "Graphite — Transaction verification for Solana AI agents"
license = "MIT"
# Publishable: no `publish = false`. Whether this crate goes to crates.io is
# the owner's decision (2026-09-29 audit, A6-15).

[dependencies]
serde = { version = "1.0", features = ["derive"] }
# `float_roundtrip` (Round 34): the default float parser is best-effort and
# reads back about one in ten arbitrary doubles one ULP off what serde_json
# wrote (measured: 21,188 of 200,000 uniform values in [0, 1)). The audit
# chain hashes a record's canonical JSON at write time and again from the
# parsed line at verify time, so an honest record whose `confidence` did not
# round-trip read as "content altered". With it, every double serde_json
# writes parses back to itself.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "2"
sha2 = "0.11"
bs58 = "0.5"
curve25519-dalek = "5"
hex = "0.4"
# Wipes the audit MAC key from memory when it is dropped (Round 34, A-7).
# Already in the tree through the ed25519/curve25519 stack; naming it adds
# no crate.
zeroize = "1"
# default-features = false is REQUIRED: reqwest's default-tls feature
# pulls native-tls → openssl-sys, which fails to build on systems without
# OpenSSL dev packages (CI containers, minimal Docker images). rustls-tls is
# the pure-Rust TLS backend.
reqwest = { version = "0.13", optional = true, default-features = false, features = ["json", "gzip", "brotli", "rustls"] }
# reqwest 0.13's `rustls` feature verifies against the host's certificate
# store; 0.12's `rustls-tls` used the bundled Mozilla roots. The RPC client
# keeps the bundled set (`tls_certs_only`), so which CAs Graphite trusts for
# its RPC does not depend on the host or image it runs in.
webpki-root-certs = { version = "1", optional = true }
base64 = "0.23"
tracing = "0.1"
# Without a subscriber installed, EVERY tracing::info!/warn!/error! call in
# this crate is a silent no-op — including audit-write failures. Found by the
# 2026-09-05 production audit; the server installs this at startup.
# `json` gives enterprise-friendly structured output; `env-filter` gives
# operators RUST_LOG control.
tracing-subscriber = { version = "0.3", optional = true, features = ["json", "env-filter"] }

# Server (feature-gated)
axum = { version = "0.8", optional = true }
# 0.5, the version axum 0.8 and tower-http 0.6 are built on: `ServiceExt`
# for the accept loop's `map_request` and the tests' `oneshot`. 0.4 with an
# unused `limit` feature compiled a second tower beside it (audit 2026-10-20).
tower = { version = "0.5", optional = true, features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "limit", "timeout", "trace", "catch-panic"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
# The server's own accept loop (A4-03, 2026-09-29 audit): axum's `serve` gives
# hyper no timer, so the request-head read had no deadline and a client that
# never finished its head held a connection forever. Both crates are already
# in the tree through axum; naming them adds no dependency.
hyper = { version = "1", optional = true, features = ["server", "http1"] }
hyper-util = { version = "0.1", optional = true, features = ["tokio", "server", "server-graceful", "service", "http1"] }

# CLI (feature-gated)
clap = { version = "4", features = ["derive"], optional = true }
ed25519-dalek = { version = "3", default-features = false, features = ["alloc", "fast"] }

[features]
default = ["server", "cli"]
server = ["dep:axum", "dep:tokio", "dep:tower-http", "dep:tower", "dep:tracing-subscriber", "dep:hyper", "dep:hyper-util", "rpc"]
# cli pulls tokio: the synchronous verify() wrapper needs an async runtime,
# and the CLI's verify subcommand uses it. A no-feature LIBRARY build still
# compiles (verify() degrades to a fail-closed stub) — only the library core
# is expected to be embeddable without a runtime.
cli = ["dep:clap", "dep:tokio"]
rpc = ["dep:reqwest", "dep:tokio", "dep:webpki-root-certs"]

[profile.release]
# Strip symbols from the shipped binary: smaller image, and less to work with
# for anyone who gains container access. `lto`/`codegen-units` trade build
# time for a faster, smaller verification hot path.
strip = true
lto = "thin"
codegen-units = 1

# Round 34 (R33-8): the profile CI's three test legs run under
# (`cargo test --profile ci-test`). It IS the release profile — opt-level 3,
# no debug assertions, no overflow checks, stripped — with one difference:
# how the code is partitioned for code generation. `lto = "thin"` with
# `codegen-units = 1` re-optimizes the whole dependency graph once per linked
# binary, and the default leg links ~160 integration-test binaries, which took
# 2,557 s of a 60-minute job and cancelled CI on main twice. Without LTO and
# with 16 units each test binary links in a fraction of that. The semantics a
# test observes (the code, the optimization level, the assertion and overflow
# behaviour) are the shipped binary's; only inlining across crate boundaries
# and unit boundaries can differ, which no test may depend on. The shipped
# binary is still built with `--release` (Dockerfile, release.yml), and the
# dashboard-e2e and deploy jobs test that exact build.
[profile.ci-test]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 3
debug-assertions = false
overflow-checks = false

[dev-dependencies]
proptest = "1.0"
# Already in the tree through reqwest's gzip support; used by the tests to
# build compressed RPC responses (Round 10).
flate2 = "1"

[[bin]]
name = "graphite"
path = "src/bin/graphite.rs"
required-features = ["cli"]

[profile.test]
opt-level = 2
