# Graphite Core Server — single-node deployment.
#
# Security model (fail-closed):
#   - TLS is intentionally terminated at a reverse proxy / LB in front of this
#     container; the container is plain HTTP on 7331 and must NOT be exposed
#     publicly without auth. See "Scaling & TLS" in README.md.
#   - `GRAPHITE_API_KEY` is REQUIRED (compose refuses to start without it, and
#     the server itself refuses to bind a non-loopback address without one).
#   - `GRAPHITE_ADMIN_API_KEY` (optional, from .env) enables /admin/*; it must
#     differ from GRAPHITE_API_KEY. Unset, the operator endpoints are disabled.
#   - State (audit log + semantic graph) lives on the `graphite-data` volume.
#     The server probes that volume for writability at startup and refuses to
#     boot if it cannot write — it will never serve traffic with no audit
#     trail (Constitution P9).
#
# Run:  cp .env.example .env   # then set GRAPHITE_API_KEY (and RPC URL)
#       docker compose up -d --build
services:
  graphite:
    build: .
    # One Core, never more (Round 36, F-019): it locks its data directory and
    # keeps its trail head, graph and rate limiter in its own process; a second
    # replica on this volume crash-loops on graphite.lock. A fixed name makes
    # `--scale graphite=2` and `deploy.replicas: 2` errors (and keeps this
    # stack and deploy/compose/docker-compose.prod.yml off one host together).
    container_name: graphite-core
    ports:
      # Bound to loopback on the HOST by default: publishing straight to
      # 0.0.0.0 would put the API on every interface of the machine, which is
      # only ever correct behind a reverse proxy. Change to "7331:7331" (or
      # front it with a proxy) deliberately, not by default.
      - "127.0.0.1:7331:7331"
    env_file: .env
    environment:
      # Fail closed: refuse to start without an API key.
      GRAPHITE_API_KEY: ${GRAPHITE_API_KEY:?set GRAPHITE_API_KEY in .env}
      GRAPHITE_DATA_DIR: /data
      # On the volume (Round 29, K1): the root filesystem below is read-only,
      # and the image's working directory is /data, so a relative path in
      # .env lands on the volume as well.
      GRAPHITE_REGISTRY_STATE: ${GRAPHITE_REGISTRY_STATE:-/data/registry_state.json}
      # Structured JSON logs for aggregators (Loki/ELK/Datadog). Set to
      # anything else for human-readable output.
      GRAPHITE_LOG_FORMAT: ${GRAPHITE_LOG_FORMAT:-json}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - graphite-data:/data
      # Round 30, tamper-evident audit trail: mount the MAC key read-only from
      # OUTSIDE the data volume and point GRAPHITE_AUDIT_KEY_FILE at it in
      # .env. The server refuses a key file group/other can read, so on the
      # host: `chown 10001:10001 audit.key && chmod 600 audit.key`.
      # - ./secrets/audit.key:/run/secrets/audit.key:ro
      # And for rotation checkpoints (GRAPHITE_AUDIT_ANCHOR_DIR=/anchors),
      # ideally storage the container can write but not rewrite:
      # - ./anchors:/anchors
    restart: unless-stopped
    # Round 30: on SIGTERM the server stops accepting and drains open requests
    # for up to its 10 s request timeout (each request's record and snapshot
    # are written before it answers). Docker's default grace is also 10 s, so
    # the SIGKILL could land inside the drain; 30 s leaves it room to finish.
    stop_signal: SIGTERM
    stop_grace_period: 30s

    # ---- runtime hardening ----
    # Matches the fixed UID/GID baked into the image so the named volume's
    # ownership stays predictable across recreates.
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # A verification server is CPU/memory-bounded work; capping it means a
    # pathological payload or traffic spike degrades this container instead of
    # the whole host. `pids` lives here rather than as a top-level
    # `pids_limit:` because Compose rejects the two being specified together.
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "2"
          memory: 512M
          pids: 256

    # Unrotated container logs will fill a host disk on a long-running
    # single-node deployment.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    # Strict here (Round 30). The image's own HEALTHCHECK passes on any 2xx
    # from /health, so a load balancer in front of several nodes keeps one
    # whose audit trail is degraded (it refuses, with 503, any verdict it
    # cannot record). This file deploys ONE node with no balancer, so the
    # container's health is the operator's signal: `--strict` marks it
    # unhealthy when /health reports `degraded: true` (audit writes or
    # rotation failing, audit disabled, a graph snapshot failing, a frozen
    # simulation baseline). Docker does not restart an unhealthy container;
    # it makes the state visible to `docker ps` and to whatever monitors it.
    healthcheck:
      test: ["CMD", "graphite", "healthcheck", "--strict"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  graphite-data:
